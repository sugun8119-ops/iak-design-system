<!-- @dsCard group="ZEM · Hub" viewport="1200x1000" name="ZEM_V1 · Integrated preview" subtitle="pattern/kit × state × 375/834/1440 · links to all 62 items" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEM_V1 · Project Design System</title><link rel="stylesheet" href="../styles.css">
<style>.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.ctl label{display:flex;flex-direction:column;gap:6px;font:var(--zem-text-caption);color:var(--zem-fg-2);font-weight:700}
.ctl select{height:44px;padding:0 14px;border-radius:var(--zem-radius-control);border:1.5px solid var(--zem-border-strong);background:var(--zem-surface);font:var(--zem-text-body);color:var(--zem-fg);min-width:180px}
.ctl select:focus-visible,.seg button:focus-visible{outline:2px solid var(--zem-focus-color);outline-offset:2px}
.seg{display:flex;gap:4px;padding:4px;border-radius:var(--zem-radius-pill);background:var(--zem-periwinkle-100)}.seg button{height:36px;padding:0 16px;border:0;border-radius:var(--zem-radius-pill);background:transparent;font:700 14px/1 var(--zem-font);color:var(--zem-periwinkle-800);cursor:pointer}.seg button[aria-pressed=true]{background:var(--zem-action);color:#fff}
.stage{border-radius:var(--zem-radius-card);background:var(--zem-periwinkle-200);padding:16px;overflow:hidden}.stage-in{transform-origin:top left;box-shadow:var(--zem-shadow-raise);border-radius:20px;overflow:hidden;background:#fff}.stage iframe{border:0;display:block}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.links div{padding:14px 16px;border-radius:var(--zem-radius-card);background:var(--zem-surface);box-shadow:var(--zem-shadow-card);display:flex;flex-direction:column;gap:6px}.links b{font:var(--zem-text-title)}.links a{font:var(--zem-text-caption);font-weight:700}</style></head>
<body><main class="mc"><header class="mc-head"><div class="ov">ZEM_V1 · Project Design System</div><h1>통합 미리보기</h1><p>키즈 모바일 서비스용 라이트 테마 시스템. 원본 보드 관찰(periwinkle 헤더·흰 둥근 카드·cyan/lime 포인트)에서 파생했습니다. 10개 패턴과 3개 UI kit은 ZEM 스타일 파생 확장입니다.</p><div class="mc-meta"><code>62 items</code><code>16 components</code><code>10 patterns</code><code>3 UI kits</code><code>375 first</code></div></header>
<section class="mc-sec"><div class="ctl"><label>화면<select id="scr"></select></label><label>상태<select id="st"></select></label><div style="display:flex;flex-direction:column;gap:6px;font:var(--zem-text-caption);color:var(--zem-fg-2);font-weight:700">뷰포트<div class="seg" id="vw" role="group" aria-label="뷰포트"><button type="button" data-w="375" aria-pressed="true">375</button><button type="button" data-w="834" aria-pressed="false">834</button><button type="button" data-w="1440" aria-pressed="false">1440</button></div></div><a id="open" href="#" target="_blank" style="height:44px;display:flex;align-items:center;font-weight:700">새 창으로 열기</a></div>
<div class="stage" id="stage"><div class="stage-in" id="stin"><iframe id="fr" title="ZEM 화면 미리보기"></iframe></div></div></section>
<section class="mc-sec"><header><h2>62개 항목</h2><p>전체 경로·근거·검증은 coverage.json, 실시간 측정은 QA 카드</p></header><div class="links" id="links"></div></section></main>
<script>
const P={dashboard:['Dashboard',['default','loading','empty','error']],analytics:['Analytics',['default','loading','empty','error']],table:['Table',['default','loading','empty','error','long-text']],detail:['Detail',['default','loading','missing-data','error']],settings:['Settings',['default','saving','error','success']],billing:['Billing',['default','loading','error','empty']],chat:['AI Chat',['default','streaming','empty','error']],builder:['Builder',['default','selected','dragging','empty']],modal:['Modal',['dialog','confirm','pending','error']],empty:['Empty',['first-run','no-results','no-access']],'kit:parent':['UI kit · 부모용',['dashboard','settings']],'kit:schedule':['UI kit · 일정용',['builder']],'kit:activity':['UI kit · 활동용',['dashboard','analytics']]};
const $=id=>document.getElementById(id),scr=$('scr'),st=$('st'),fr=$('fr'),stage=$('stage'),stin=$('stin');let W=375;
const saved=JSON.parse(localStorage.getItem('zem-hub')||'{}');
scr.innerHTML=Object.entries(P).map(([k,[l]])=>`<option value="${k}">${l}</option>`).join('');scr.value=P[saved.p]?saved.p:'dashboard';W=saved.w||375;
function fill(){st.innerHTML=P[scr.value][1].map(s=>`<option>${s}</option>`).join('');if(saved.s&&P[scr.value][1].includes(saved.s))st.value=saved.s}
function src(){const k=scr.value;return k.startsWith('kit:')?`ui_kits/${k.slice(4)}.html?p=${st.value}`:`patterns/screen.html?p=${k}&s=${st.value}`}
function fit(){const H=Math.round(W<640?812:W<1024?1112:900);fr.style.width=W+'px';fr.style.height=H+'px';const s=Math.min(1,(stage.clientWidth-32)/W);stin.style.transform=`scale(${s})`;stin.style.width=W+'px';stage.style.height=(H*s+32)+'px'}
function go(){fr.src=src();$('open').href=src();fit();document.querySelectorAll('#vw button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.w===W));localStorage.setItem('zem-hub',JSON.stringify({p:scr.value,s:st.value,w:W}))}
scr.onchange=()=>{saved.s=null;fill();go()};st.onchange=go;document.querySelectorAll('#vw button').forEach(b=>b.onclick=()=>{W=+b.dataset.w;go()});addEventListener('resize',fit);fill();go();
const G=[['Foundations · Color',['colors-primary','colors-neutral','colors-semantic','accents','surfaces'].map(f=>'foundations/'+f)],['Foundations · Type',['type-display','type-scale','type-specimens'].map(f=>'foundations/'+f)],['Foundations · Space/Shape',['spacing','radii','borders','shadows'].map(f=>'foundations/'+f)],['Foundations · System',['layout-focus-motion','motion','icons','iconography','brand','props-map','namespace'].map(f=>'foundations/'+f)],['Overview',['buttons','inputs','cards','chips','toasts'].map(f=>'foundations/'+f)],['Components 16',['Button','TextField','Textarea','Select','Checkbox','Switch','Badge','Card','Skeleton','Icon','Dialog','Menu','Table','Pagination','Toast','AlertDialog'].map(f=>'components/'+f)],['Patterns 10',['01-dashboard','02-analytics','03-table','04-detail','05-settings','06-billing','07-chat','08-builder','09-modal','10-empty'].map(f=>'patterns/'+f)],['UI kits 3',['parent','schedule','activity'].map(f=>'ui_kits/'+f)],['Docs 7',['00-rulebook','01-components','02-states','03-layout','04-qa-checklist','05-ai-prompt','06-changelog'].map(f=>'docs/'+f)],['Hub 2',['index','qa']]];
$('links').innerHTML=G.map(([t,fs])=>`<div><b>${t}</b>${fs.map(f=>`<a href="${f}.html">${f.split('/').pop()}</a>`).join('')}</div>`).join('');
</script></body></html>
