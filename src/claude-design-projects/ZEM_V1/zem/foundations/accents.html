<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEM_V1 · Colors · Point accents & tiles</title><link rel="stylesheet" href="../../styles.css"><script src="../lib/icons.js"></script><style>.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.sw{margin:0;background:var(--zem-surface);border-radius:16px;box-shadow:var(--zem-shadow-card);overflow:hidden}.sw i{display:block;height:64px}.sw figcaption{padding:10px 12px;display:flex;flex-direction:column;gap:3px;font:var(--zem-text-caption)}.sw code{font:var(--zem-text-code);font-size:11px;color:var(--zem-fg-2)}.sw .mc-tag{align-self:flex-start}.cr{color:var(--zem-fg-2)}.tiles{display:flex;gap:14px;flex-wrap:wrap}.tiles figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;font:var(--zem-text-caption);color:var(--zem-fg-2)}</style></head><body><main class="mc"><header class="mc-head"><div class="ov">ZEM_V1 · Colors</div><h1>Colors · Point accents & tiles</h1><p>원본의 cyan/lime 포인트 아이콘 역할(관찰, hex는 샘플 추정)을 rounded-square 아이콘 타일로 체계화. 타일 위 아이콘은 같은 계열의 어두운 색으로 3:1 이상 확보. 넓은 면적 배경으로 쓰지 않습니다.</p></header><section class="mc-sec"><div class="sws"><figure class="sw" data-c="var(--zem-cyan-500)"><i style="background:var(--zem-cyan-500)"></i><figcaption><b>cyan 500</b><code>--zem-cyan-500</code><span class="hx"></span><span class="mc-tag" data-t="code">역할 관찰 · hex 추정</span><span class="cr"></span></figcaption></figure><figure class="sw" data-c="var(--zem-cyan-100)"><i style="background:var(--zem-cyan-100)"></i><figcaption><b>cyan 100</b><code>--zem-cyan-100</code><span class="hx"></span><span class="mc-tag" data-t="design-only">derived</span><span class="cr"></span></figcaption></figure><figure class="sw" data-c="var(--zem-lime-100)"><i style="background:var(--zem-lime-100)"></i><figcaption><b>lime 100</b><code>--zem-lime-100</code><span class="hx"></span><span class="mc-tag" data-t="code">역할 관찰 · hex 추정</span><span class="cr"></span></figcaption></figure><figure class="sw" data-c="var(--zem-lime-300)"><i style="background:var(--zem-lime-300)"></i><figcaption><b>lime 300</b><code>--zem-lime-300</code><span class="hx"></span><span class="mc-tag" data-t="code">역할 관찰 · hex 추정</span><span class="cr"></span></figcaption></figure><figure class="sw" data-c="var(--zem-lime-600)"><i style="background:var(--zem-lime-600)"></i><figcaption><b>lime 600</b><code>--zem-lime-600</code><span class="hx"></span><span class="mc-tag" data-t="code">역할 관찰 · hex 추정</span><span class="cr"></span></figcaption></figure><figure class="sw" data-c="var(--zem-violet-500)"><i style="background:var(--zem-violet-500)"></i><figcaption><b>violet 500</b><code>--zem-violet-500</code><span class="hx"></span><span class="mc-tag" data-t="code">역할 관찰 · hex 추정</span><span class="cr"></span></figcaption></figure><figure class="sw" data-c="var(--zem-sky-500)"><i style="background:var(--zem-sky-500)"></i><figcaption><b>sky 500</b><code>--zem-sky-500</code><span class="hx"></span><span class="mc-tag" data-t="code">역할 관찰 · hex 추정</span><span class="cr"></span></figcaption></figure></div></section><section class="mc-sec"><header><h2>Icon tiles 40 · radius 10</h2></header><div class="tiles" id="tiles"></div></section></main><script src="../lib/contrast.js"></script><script>ZEMContrast.annotate()</script><script>const G=n=>{const i=ZEM_ICONS[n];return '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+i.body+'</svg>'};document.getElementById('tiles').innerHTML=[['cyan','solar:calendar-fill'],['peri','solar:checklist-bold'],['violet','solar:bag-2-bold'],['lime','solar:target-bold'],['mint','eva:checkmark-fill'],['orange','solar:bell-bold'],['coral','solar:shield-warning-bold'],['soft','solar:chat-round-line-bold']].map(([c,n])=>'<figure><span class="tile '+c+'">'+(ZEM_ICONS[n]?G(n):G('eva:calendar-fill'))+'</span>'+c+'</figure>').join('')</script></body></html>
