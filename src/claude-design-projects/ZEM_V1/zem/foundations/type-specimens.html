<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEM_V1 · Type · Specimens</title><link rel="stylesheet" href="../../styles.css"></head><body><main class="mc"><header class="mc-head"><div class="ov">ZEM_V1 · Type</div><h1>Type · Specimens</h1><p>한글·영문·숫자 혼용 샘플. Nanum Barun Gothic 400/700만 사용. 숫자는 tabular(tnum) 권장.</p></header><div class="zem-card"><div style="font:var(--zem-text-display)">가나다라 ZEM 0123</div><div style="font:var(--zem-text-body)">400 · 오늘 할 일 3개 중 2개를 완료했어요. Mission 2/3</div><div style="font:var(--zem-text-body-strong)">700 · 수학 학습지 풀기 — 오후 5:00까지</div><div class="kpi">87%</div><div style="font:var(--zem-text-body);max-width:320px;overflow-wrap:anywhere;padding:10px;border:1.5px dashed var(--zem-border-strong);border-radius:12px">긴 문구 · 이번 주말 가족 나들이 준비물 챙기기와 할머니 댁 방문 일정 확인하고 사진 보내기 (320px)</div></div><div class="mc-note"><b>로드 확인</b> · <span id="ff">확인 중…</span></div><script>document.fonts.ready.then(async()=>{await Promise.all([document.fonts.load('400 16px "Nanum Barun Gothic"'),document.fonts.load('700 16px "Nanum Barun Gothic"')]);const r=document.fonts.check('400 16px "Nanum Barun Gothic"'),b=document.fonts.check('700 16px "Nanum Barun Gothic"');const faces=[...document.fonts].filter(f=>f.family.replace(/"/g,'')==='Nanum Barun Gothic').map(f=>f.weight+':'+f.status);document.getElementById('ff').textContent='Regular 400 '+(r?'로드됨':'미로드')+' · Bold 700 '+(b?'로드됨':'미로드')+' · faces '+faces.join(', ');window.__ZEM_FONT={r,b,faces};console.log('ZEM-FONT '+JSON.stringify(window.__ZEM_FONT))})</script></main></body></html>
