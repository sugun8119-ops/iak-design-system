<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEM_V1 · Colors · Ink neutrals</title><link rel="stylesheet" href="../../styles.css"><style>.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.sw{margin:0;background:var(--zem-surface);border-radius:16px;box-shadow:var(--zem-shadow-card);overflow:hidden}.sw i{display:block;height:64px}.sw figcaption{padding:10px 12px;display:flex;flex-direction:column;gap:3px;font:var(--zem-text-caption)}.sw code{font:var(--zem-text-code);font-size:11px;color:var(--zem-fg-2)}.sw .mc-tag{align-self:flex-start}.cr{color:var(--zem-fg-2)}</style></head><body><main class="mc"><header class="mc-head"><div class="ov">ZEM_V1 · Colors</div><h1>Colors · Ink neutrals</h1><p>원본 제목은 검정, 보조 텍스트는 옅은 회보라(관찰). 앱 UI 가독성을 위해 periwinkle 기운의 ink 스케일을 파생했습니다. 본문 텍스트는 900/500만 사용(흰 배경 4.5:1 이상).</p></header><section class="mc-sec"><div class="sws"><figure class="sw" data-c="var(--zem-ink-900)"><i style="background:var(--zem-ink-900)"></i><figcaption><b>900 text</b><code>--zem-ink-900</code><span class="hx"></span><span class="mc-tag" data-t="design-only">derived</span><span class="cr"></span></figcaption></figure><figure class="sw" data-c="var(--zem-ink-700)"><i style="background:var(--zem-ink-700)"></i><figcaption><b>700</b><code>--zem-ink-700</code><span class="hx"></span><span class="mc-tag" data-t="design-only">derived</span><span class="cr"></span></figcaption></figure><figure class="sw" data-c="var(--zem-ink-500)"><i style="background:var(--zem-ink-500)"></i><figcaption><b>500 text-2</b><code>--zem-ink-500</code><span class="hx"></span><span class="mc-tag" data-t="design-only">derived</span><span class="cr"></span></figcaption></figure><figure class="sw" data-c="var(--zem-ink-400)"><i style="background:var(--zem-ink-400)"></i><figcaption><b>400 placeholder</b><code>--zem-ink-400</code><span class="hx"></span><span class="mc-tag" data-
