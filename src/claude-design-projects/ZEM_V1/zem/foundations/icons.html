<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEM_V1 · Icons</title><link rel="stylesheet" href="../../styles.css"><script src="../lib/icons.js"></script><style>.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}.ig figure{margin:0;padding:12px 8px;border-radius:16px;background:#fff;box-shadow:var(--zem-shadow-card);display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--zem-action)}.ig figcaption{font:var(--zem-text-code);font-size:10px;color:var(--zem-fg-2);text-align:center;overflow-wrap:anywhere}.ig .un{background:transparent;box-shadow:none;border:1.5px dashed var(--zem-border-strong);color:var(--zem-fg-placeholder)}</style></head><body><main class="mc"><header class="mc-head"><div class="ov">ZEM_V1 · Foundations</div><h1>Icons</h1><p>일반 기능 아이콘(오픈소스 Eva/Solar) SVG 97개 실제 렌더. 원본 이름 106개 중 9개는 SVG 데이터가 없어 Icon이 null을 반환합니다(제약). ZEM 원본 아이콘 아트워크는 복제하지 않았습니다.</p></header><section class="mc-sec"><header><h2 id="c1"></h2></header><div class="ig" id="ok"></div></section><section class="mc-sec"><header><h2>Unresolved · 9 (제약)</h2><p>사용 금지 — 대체 아이콘을 고르거나 SVG를 추가해야 합니다.</p></header><div class="ig" id="un"></div></section></main><script>const I=ZEM_ICONS,k=Object.keys(I);document.getElementById('c1').textContent='Available · '+k.length;document.getElementById('ok').innerHTML=k.map(n=>'<figure><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+I[n].body+'</svg><figcaption>'+n+'</figcaption></figure>').join('');document.getElementById('un').innerHTML=(window.ZEM_ICONS_UNRESOLVED||[]).map(n=>'<figure class="un"><span style="font:700 18px/24px var(--zem-font)">∅</span><figcaption>'+n+'</figcaption></figure>').join('')</script></body></html>
