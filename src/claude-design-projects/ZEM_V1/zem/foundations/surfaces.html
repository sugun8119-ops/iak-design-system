<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEM_V1 · Colors · Surfaces & header</title><link rel="stylesheet" href="../../styles.css"><style>.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.sw{margin:0;background:var(--zem-surface);border-radius:16px;box-shadow:var(--zem-shadow-card);overflow:hidden}.sw i{display:block;height:64px}.sw figcaption{padding:10px 12px;display:flex;flex-direction:column;gap:3px;font:var(--zem-text-caption)}.sw code{font:var(--zem-text-code);font-size:11px;color:var(--zem-fg-2)}.sw .mc-tag{align-self:flex-start}.cr{color:var(--zem-fg-2)}.demo{border-radius:var(--zem-radius-card);background:var(--zem-bg);overflow:hidden;box-shadow:var(--zem-shadow-card)}.demo .hd{background:var(--zem-header);color:#fff;padding:18px 20px 52px;border-radius:0 0 28px 28px;font:var(--zem-text-h2)}.demo .bd{margin:-36px 16px 16px;display:grid;gap:10px}</style></head><body><main class="mc"><header class="mc-head"><div class="ov">ZEM_V1 · Colors</div><h1>Colors · Surfaces & header</h1><p>밝은 테마 전용. 페이지 배경 periwinkle-50, 흰 카드, 라벤더 패널 · 하단이 둥근 periwinkle 헤더(역할 관찰, hex는 샘플 추정).</p></header><section class="mc-sec"><div class="sws"><figure class="sw" data-c="var(--zem-bg)"><i style="background:var(--zem-bg)"></i><figcaption><b>bg</b><code>--zem-bg</code><span class="hx"></span><span class="mc-tag" data-t="design-only">derived</span><span class="cr"></span></figcaption></figure><figure class="sw" data-c="var(--zem-surface)"><i style="background:var(--zem-surface)"></i><figcaption><b>surface card</b><code>--zem-surface</code><span class="hx"></span><span class="mc-tag" data-t="code">역할 관찰 · hex 추정</span><span class="cr"></span></figcaption></figure><figure class="sw" data-c="var(--zem-surface-tint)"><i style="background:var(--zem-surface-tint)"></i><figcaption><b>surface tint</b><code>--zem-surface-tint</code><span class="hx"></span><span class="mc
