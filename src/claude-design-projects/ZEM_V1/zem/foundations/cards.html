<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEM_V1 · Cards overview</title><link rel="stylesheet" href="../../styles.css"><script src="../lib/icons.js"></script><style></style></head><body><main class="mc"><header class="mc-head"><div class="ov">ZEM_V1 · Overview</div><h1>Cards overview</h1><p>원본 관찰 구조(흰 둥근 카드 · 아이콘 타일 행 · 체크 원 · 진행 막대)를 자체 콘텐츠로 구성.</p></header><div class="mc-grid"><div class="zem-card"><div class="row between"><div class="stack" style="gap:4px"><b style="font:var(--zem-text-h2)">지금은 자유 시간이에요</b><span class="muted cap">오후 3:00 – 4:30</span></div><span class="tile peri" data-ic="solar:clock-circle-bold"></span></div><div class="prog"><i style="width:62%"></i></div><span class="muted cap">남은 시간 34분</span></div><div class="zem-card"><h2>오늘 일정</h2><ul class="rows"><li><span class="tile cyan" data-ic="eva:calendar-fill"></span><div class="t"><b>피아노 학원</b><span>오후 4:00</span></div><span class="done" data-ic="eva:checkmark-fill" data-s="16"></span></li><li><span class="tile violet" data-ic="solar:book-bold"></span><div class="t"><b>독서 20분</b><span>저녁 8:00</span></div><span class="done todo" data-ic="eva:arrow-ios-forward-fill" data-s="16"></span></li></ul></div><div class="zem-card"><h2>이번 주 미션</h2><div class="kpi">3 / 5</div><div class="prog"><i style="width:60%"></i></div><button class="zem-button zem-button--sm zem-button--secondary" style="align-self:flex-start"><span>전체 보기</span></button></div></div></main><script>const G=(n,s)=>ZEM_ICONS[n]?'<svg width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+ZEM_ICONS[n].body+'</svg>':'';document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=G(e.dataset.ic,+e.dataset.s||20)+e.innerHTML);</script></body></html>
