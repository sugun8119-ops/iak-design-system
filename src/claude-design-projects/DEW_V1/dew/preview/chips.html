</span></figcaption></figure></div></section><section class="dc-sec"><header><span class="n">02</span><h2>Design-only</h2></header><div class="dc-grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))"><figure class="dc-case " data-case="filter" data-tag="design-only"><div class="dc-demo" style=""><button class="dew-button dew-button--sm" style="background:var(--dew-black);color:#fff"><span>특집</span></button><button class="dew-button dew-button--sm" style="border-color:var(--dew-line-mid)"><span>인터뷰</span></button></div><figcaption class="dc-cap"><span>Filter chip · selected / idle</span><span class="dc-tag" data-t="design-only">design-only</span></figcaption></figure><figure class="dc-case " data-case="dot" data-tag="design-only"><div class="dc-demo" style=""><span class="row dew-small"><i style="width:8px;height:8px;border-radius:50%;background:var(--dew-success);display:inline-block"></i>발행됨</span><span class="row dew-small"><i style="width:8px;height:8px;border-radius:50%;background:var(--dew-action);display:inline-block"></i>라이브</span></div><figcaption class="dc-cap"><span>Status dot</span><span class="dc-tag" data-t="design-only">design-only</span></figcaption></figure></div></section></main><script>(function(){setTimeout(function(){var d=document.documentElement,cs=getComputedStyle(d);var figs=[].slice.call(document.querySelectorAll('[data-case]'));window.__DEW_RENDERED={component:"Chips & Status",cases:figs.map(function(f){var r=f.getBoundingClientRect();return {id:f.dataset.case,tag:f.dataset.tag||'derived',rendered:r.height>0&&f.childElementCount>0,overflowX:f.scrollWidth>f.clientWidth+1}}),tokensLinked:cs.getPropertyValue('--dew-action').trim()!=='',docOverflowX:d.scrollWidth>d.clientWidth+1,width:d.clientWidth};console.log('DEW-SHEET '+JSON.stringify({c:"Chips & Status",n:figs.length,doc:window.__DEW_RENDERED.docOverflowX}))},400)})();</script></body></html>
