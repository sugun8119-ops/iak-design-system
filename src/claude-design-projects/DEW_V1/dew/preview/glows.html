<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEW_V1 · Emphasis · Rules</title><link rel="stylesheet" href="../../styles.css"></head><body><main class="dc"><header class="dc-head"><div><div class="dew-overline">DEW_V1 · Spacing</div><h1>Emphasis · Rules</h1></div><p>기존 Glows 항목 자리. DEW는 발광 효과를 쓰지 않으므로 강조를 선·밑줄·굵은 상단선으로 대체 (derived).</p><div class="dc-meta"><code>glow: none</code><code>emphasis = rule</code></div></header><section class="dc-sec"><header><span class="n">01</span><h2>Emphasis devices</h2></header><div class="dc-grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))"><figure class="dc-case " data-case="heavy-top" data-tag="derived"><div class="dc-demo" style=""><div style="width:100%;border-top:var(--dew-rule-heavy);padding-top:10px" class="dew-h3">Features</div></div><figcaption class="dc-cap"><span>굵은 상단선 · 섹션 시작</span><span class="dc-tag" data-t="derived">derived</span></figcaption></figure><figure class="dc-case " data-case="red-top" data-tag="derived"><div class="dc-demo" style=""><div class="dew-card" style="width:100%;border-top:3px solid var(--dew-action)"><span class="dew-overline">MEMBER</span></div></div><figcaption class="dc-cap"><span>빨강 상단선 · 선택/추천 카드</span><span class="dc-tag" data-t="derived">derived</span></figcaption></figure><figure class="dc-case " data-case="underline" data-tag="derived"><div class="dc-demo" style=""><a href="#" style="font:var(--dew-text-title)">기사 전체 보기</a></div><figcaption class="dc-cap"><span>텍스트 링크 밑줄 1px · offset 4</span><span class="dc-tag" data-t="derived">derived</span></figcaption></figure><figure class="dc-case " data-case="numeral" data-tag="derived"><div class="dc-demo" style=""><span style="font:400 64px/1 var(--dew-font-display);color:var(--dew-grey-300)">04</span><span class="dew-h3">밤의 도서관</span></div><figcaption class="dc-cap"><span>큰 번호 · 목록 리듬</span><span class="dc-tag" data-t="derived">derived</span></figcaption></figure><figure class="dc-case " data-case="no-glow" data-tag="derived"><div class="dc-demo" style=""><span class="dew-small dew-muted">glow · neon · gradient 사용 안 함</span></div><figcaption class="dc-cap"><span>금지 · box-shadow glow / gradient</span><span class="dc-tag" data-t="derived">derived</span></figcaption></figure></div></section></main><script>(function(){setTimeout(function(){var d=document.documentElement,cs=getComputedStyle(d);var figs=[].slice.call(document.querySelectorAll('[data-case]'));window.__DEW_RENDERED={component:"Emphasis · Rules",cases:figs.map(function(f){var r=f.getBoundingClientRect();return {id:f.dataset.case,tag:f.dataset.tag||'derived',rendered:r.height>0&&f.childElementCount>0,overflowX:f.scrollWidth>f.clientWidth+1}}),tokensLinked:cs.getPropertyValue('--dew-action').trim()!=='',docOverflowX:d.scrollWidth>d.clientWidth+1,width:d.clientWidth};console.log('DEW-SHEET '+JSON.stringify({c:"Emphasis · Rules",n:figs.length,doc:window.__DEW_RENDERED.docOverflowX}))},400)})();</script></body></html>
