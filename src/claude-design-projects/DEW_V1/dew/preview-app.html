<!-- @dsCard group="DEW · Hub" viewport="1440x1000" name="Hub & integrated preview" subtitle="pick screen · state · 1440 / 834 / 375 — real rendered frames" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEW_V1 · Integrated preview</title><link rel="stylesheet" href="../styles.css"><script src="lib/catalog.js"></script></head><body><main class="dc"><header class="dc-head"><div><div class="dew-overline">DEW_V1 · Hub</div><h1>통합 미리보기</h1></div><p>실제 렌더 화면. 화면·상태·뷰포트를 고르면 프레임이 선택 폭 그대로 렌더되고 화면에 맞게 축소 표시됩니다.</p></header>
<div class="row" style="align-items:flex-end;gap:24px;flex-wrap:wrap"><div class="dew-field" style="min-width:220px"><label for="scr">화면</label><select id="scr" class="dew-input"></select></div><div class="dew-field" style="min-width:0;max-width:100%"><label id="stl">상태</label><div class="row" id="st" role="group" aria-labelledby="stl" style="gap:0;flex-wrap:wrap;padding-left:1px"></div></div><div class="dew-field"><label id="vwl">뷰포트</label><div class="row" id="vw" role="group" aria-labelledby="vwl" style="gap:0"></div></div><a class="dew-button dew-button--text dew-button--md" id="open" href="#" target="_blank">새 탭에서 열기</a></div>
<div><div class="dew-caption" id="stat" style="margin-bottom:12px">로드 중…</div><div id="fw" style="margin:0 auto;max-width:100%;overflow:hidden;border:1px solid var(--dew-black)"><iframe id="fr" title="패턴 미리보기" style="border:0;transform-origin:0 0;display:block;background:#fff"></iframe></div></div></main>
<style>.seg{height:40px;padding:0 14px;border:1px solid var(--dew-line-mid);margin-left:-1px;background:#fff;font:var(--dew-text-small);cursor:pointer;transition:background var(--dew-motion-fast) var(--dew-ease)}.seg:hover{border-color:var(--dew-black)}.seg[aria-pressed=true]{background:var(--dew-black);color:#fff;border-color:var(--dew-black);position:relative}</style>
<script>const PAT=[['dashboard','Dashboard',['default','loading','empty','error']],['analytics','Analytics',['default','loading','empty','error']],['table','Table',['default','loading','empty','error','long-text']],['detail','Detail',['default','loading','missing-data','error']],['settings','Settings',['default','saving','error','success']],['billing','Billing',['default','loading','error','empty']],['chat','AI Chat',['default','streaming','empty','error']],['builder','Builder',['default','selected','dragging','empty']],['modal','Modal',['dialog','confirm','pending','error']],['empty','Empty',['first-run','no-results','no-access']]];
const VWS=[[1440,900,'1440'],[834,1112,'834'],[375,812,'375']];const $=id=>document.getElementById(id);const KEY='dew-v1-preview';
let cur=Object.assign({p:'dashboard',s:'default',w:1440},JSON.parse(localStorage.getItem(KEY)||'{}'));
$('scr').innerHTML=PAT.map(([k,l],i)=>'<option value="'+k+'">'+String(i+1).padStart(2,'0')+' · '+l+'</option>').join('');
$('vw').innerHTML=VWS.map(([w,,l])=>'<button type="button" class="seg" data-w="'+w+'">'+l+'</button>').join('');
function render(){const pat=PAT.find(x=>x[0]===cur.p)||PAT[0];if(!pat[2].includes(cur.s))cur.s=pat[2][0];localStorage.setItem(KEY,JSON.stringify(cur));$('scr').value=cur.p;
 $('st').innerHTML=pat[2].map(s=>'<button type="button" class="seg" data-s="'+s+'" aria-pressed="'+(s===cur.s)+'">'+s+'</button>').join('');[...$('vw').children].forEach(b=>b.setAttribute('aria-pressed',+b.dataset.w===cur.w));
 const url='patterns/screen.html?p='+cur.p+'&s='+cur.s;$('open').href=url;const fr=$('fr');if(fr.dataset.src!==url+cur.w){fr.dataset.src=url+cur.w;fr.src=url;$('stat').textContent='로드 중…'}fit()}
function fit(){const [w,hh]=VWS.find(v=>v[0]===cur.w);const avail=$('fw').parentNode.clientWidth-2;const sc=Math.min(1,avail/w);const fr=$('fr');fr.style.width=w+'px';fr.style.height=hh+'px';fr.style.transform='scale('+sc+')';$('fw').style.width=w*sc+2+'px';$('fw').style.height=hh*sc+2+'px';fr.dataset.scale=Math.round(sc*100)}
$('scr').onchange=e=>{cur.p=e.target.value;cur.s='';render()};$('st').onclick=e=>{const b=e.target.closest('button');if(b){cur.s=b.dataset.s;render()}};$('vw').onclick=e=>{const b=e.target.closest('button');if(b){cur.w=+b.dataset.w;render()}};addEventListener('resize',fit);
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='dew-pattern')return;$('stat').innerHTML='<b>'+d.p+' · '+d.s+'</b> — 렌더 폭 '+d.width+'px · 표시 '+$('fr').dataset.scale+'% · <span class="'+(d.overflowX?'dc-bad':'dc-ok')+'">'+(d.overflowX?'가로 넘침 있음':'가로 넘침 없음')+'</span>'});render();
</script></body></html>
