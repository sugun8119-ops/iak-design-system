<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEW_V1 · Information architecture</title><link rel="stylesheet" href="../../styles.css"><script src="../lib/catalog.js"></script></head><body><main class="dc"><header class="dc-head"><div><div class="dew-overline">DEW_V1 · Docs</div><h1>Information architecture</h1></div><p>현재 사본의 62개 기준 카드 전체를 DEW 파일로 1:1 대응. 삭제된 항목 없음.</p><div class="dc-meta"><code>62 → 62</code><code>groups renamed, no IAK/RAIS</code></div></header><div id="ia"></div></main><script>var g={};DEW_CATALOG.forEach(function(c){(g[c.group]=g[c.group]||[]).push(c)});document.getElementById('ia').innerHTML='<div class="dc-scroll"><table class="dc-tbl"><thead><tr><th>#</th><th>DEW group</th><th>DEW item</th><th>basis</th><th>baseline group · item</th></tr></thead><tbody>'+DEW_CATALOG.map(function(c){return '<tr data-case="i'+c.n+'" data-tag="derived"><td>'+c.n+'</td><td>'+c.group+'</td><td><a href="../../'+c.path+'">'+c.name+'</a></td><td>'+c.basis+'</td><td class="dew-muted">'+c.baseline.group.replace(/Master · /,'')+' · '+c.baseline.name.replace(/RAIS|IAK/g,'[archived]')+'</td></tr>'}).join('')+'</tbody></table></div><p class="dew-caption" style="margin-top:12px">'+Object.keys(g).map(function(k){return k+' '+g[k].length}).join(' / ')+'</p>'</script><script>(function(){setTimeout(function(){var d=document.documentElement,cs=getComputedStyle(d);var figs=[].slice.call(document.querySelectorAll('[data-case]'));window.__DEW_RENDERED={component:document.title,cases:figs.map(function(f){var r=f.getBoundingClientRect();return {id:f.dataset.case,tag:f.dataset.tag||'derived',rendered:r.height>0&&(f.childElementCount>0||f.textContent.trim().length>0),overflowX:f.scrollWidth>f.clientWidth+1}}),tokensLinked:cs.getPropertyValue('--dew-action').trim()!=='',docOverflowX:d.scrollWidth>d.clientWidth+1,width:d.clientWidth}},window.__DEW_AUDIT_DELAY||700)})();</script></body></html>
