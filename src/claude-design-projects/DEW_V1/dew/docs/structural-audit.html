<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEW_V1 · Structural audit</title><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="../lib/icons.js"></script><script src="../lib/dew-ui.js"></script><script src="../lib/catalog.js"></script></head><body><main class="dc"><header class="dc-head"><div><div class="dew-overline">DEW_V1 · Docs</div><h1>Structural audit</h1></div><p>열 때마다 구조를 실제로 검사합니다.</p><div class="dc-meta"><code>live</code><code>Pass / Fail per check</code></div></header><div id="sa">검사 중…</div></main><script>window.__DEW_AUDIT_DELAY=3000;(async function(){var rows=[];var toks=new Set(),bad=new Set();(function walk(list){for(var s of list){try{for(var r of s.cssRules){if(r.styleSheet)walk([r.styleSheet]);if(r.cssRules&&!r.selectorText)walk([{cssRules:r.cssRules}]);if(r.style)for(var p of r.style)if(p.startsWith('--')){if(/^--dew-/.test(p))toks.add(p);if(/^--(rais|iak|accent|bg-)/.test(p))bad.add(p)}}}catch(e){}}})([...document.styleSheets]);
rows.push(['DEW tokens defined',toks.size+' --dew-* custom properties',toks.size>100]);rows.push(['IAK/RAIS tokens loaded',bad.size?[...bad].slice(0,5).join(', '):'none',bad.size===0]);
var comps=['Icon','Button','TextField','Textarea','Select','Checkbox','Switch','Badge','Card','Skeleton','Dialog','Menu','Table','Pagination','ToastProvider','AlertDialog'].filter(function(k){return typeof DEW[k]==='function'||typeof DEW[k]==='object'});rows.push(['Runtime components',comps.length+' / 16',comps.length===16]);
