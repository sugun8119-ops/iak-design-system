verline">DEW_V1 · Docs</div><h1>Documentation viewer</h1></div><p>프로젝트 문서를 원문 마크다운 없이 렌더. 항목을 펼쳐 읽으세요.</p><div class="dc-meta"><code>claude-system.md</code><code>source-observations.md</code><code>readme.md</code></div></header><div id="docs" class="stack" style="gap:0;border-top:var(--dew-rule-heavy)"></div></main><script>window.__DEW_AUDIT_DELAY=1500;[['../claude-system.md','claude-system.md · 생성 규칙',true],['../source-observations.md','source-observations.md · 관찰 vs 파생'],['../../readme.md','readme.md · 컴포넌트 목록']].forEach(function(x,i){var el=document.createElement('details');el.setAttribute('data-case','doc'+i);el.setAttribute('data-tag','derived');if(x[2])el.open=true;el.style.cssText='border-bottom:var(--dew-rule-hair);padding:16px 0';el.innerHTML='<summary style="cursor:pointer;font:var(--dew-text-h3)">'+x[1]+'</summary><div class="md" style="padding-top:8px">불러오는 중…</div>';document.getElementById('docs').appendChild(el);fetch(x[0]).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){el.querySelector('.md').innerHTML=mdRender(t)}).catch(function(){el.querySelector('.md').innerHTML='<p class="dew-error">문서를 불러오지 못했습니다.</p>'})})</script><script>(function(){setTimeout(function(){var d=document.documentElement,cs=getComputedStyle(d);var figs=[].slice.call(document.querySelectorAll('[data-case]'));window.__DEW_RENDERED={component:document.title,cases:figs.map(function(f){var r=f.getBoundingClientRect();return {id:f.dataset.case,tag:f.dataset.tag||'derived',rendered:r.height>0&&(f.childElementCount>0||f.textContent.trim().length>0),overflowX:f.scrollWidth>f.clientWidth+1}}),tokensLinked:cs.getPropertyValue('--dew-action').trim()!=='',docOverflowX:d.scrollWidth>d.clientWidth+1,width:d.clientWidth}},window.__DEW_AUDIT_DELAY||700)})();</script></body></html>
