<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEW_V1 · QA</title><link rel="stylesheet" href="../styles.css"><script src="lib/catalog.js"></script></head><body><main class="dc"><header class="dc-head"><div><div class="dew-overline">DEW_V1 · QA</div><h1>렌더 · 반응형 검사</h1></div><p>열 때마다 실제 iframe으로 로드해 검사합니다. 과거 점수는 쓰지 않습니다. 항목: 로드, 케이스 렌더(요소 존재·높이&gt;0), 토큰 연결(--dew-action 해석), 문서 가로 넘침 @1200 / @375, 패턴 1440/834/375.</p><div class="dc-meta"><code id="qs">대기 중…</code></div></header>
<section class="dc-sec"><header><span class="n">01</span><h2>62 기준 항목</h2></header><div class="dc-scroll"><table class="dc-tbl"><thead><tr><th>#</th><th>항목</th><th>파일</th><th>케이스</th><th>토큰</th><th>@1200</th><th>@375</th></tr></thead><tbody id="qc"></tbody></table></div></section>
<section class="dc-sec"><header><span class="n">02</span><h2>패턴 10 × 상태 × 뷰포트</h2></header><div class="dc-scroll"><table class="dc-tbl"><thead><tr><th>pattern · state</th><th>1440</th><th>834</th><th>375</th></tr></thead><tbody id="qp"></tbody></table></div></section></main>
<div id="frames" style="position:absolute;left:-99999px;top:0;opacity:0;pointer-events:none"></div><script>const PAT=[['dashboard','Dashboard',['default','loading','empty','error']],['analytics','Analytics',['default','loading','empty','error']],['table','Table',['default','loading','empty','error','long-text']],['detail','Detail',['default','loading','missing-data','error']],['settings','Settings',['default','saving','error','success']],['billing','Billing',['default','loading','error','empty']],['chat','AI Chat',['default','streaming','empty','error']],['builder','Builder',['default','selected','dragging','empty']],['modal','Modal',['dialog','confirm','pending','error']],['empty','Empty',['first-run','no-results','no-access']]];
const box=document.getElementById('frames'),qs=document.getElementById('qs');
function load(src,w,h,probe){return new Promise(res=>{const f=document.createElement('iframe');f.style.width=w+'px';f.style.height=h+'px';f.src=src;let n=0;const t=setInterval(()=>{n++;let v;try{v=probe(f.contentWindow,f.contentDocument,n)}catch(e){}if(v||n>60){clearInterval(t);f.remove();res(v||null)}},150);box.appendChild(f)})}
async function pool(jobs,k){const out=[];let i=0;await Promise.all(Array.from({length:k},async()=>{while(i<jobs.length){const j=i++;out[j]=await jobs[j]()}}));return out}
const probe=(w,d)=>{if(d.readyState!=='complete')return null;if(w.__DEW_RENDERED)return w.__DEW_RENDERED;if(w.__DEW_PATTERN)return w.__DEW_PATTERN;if(w.__DEW_DOC)return w.__DEW_DOC;return null};
const lite=(w,d)=>{if(d.readyState!=='complete'||!d.body||d.body.innerText.trim().length<20)return null;const e=d.documentElement;return {docOverflowX:e.scrollWidth>e.clientWidth+1,tokensLinked:getComputedStyle(e).getPropertyValue('--dew-action').trim()!=='',lite:true}};
const both=(w,d)=>{const a=probe(w,d);if(a)return a;return null};
(async()=>{const C=DEW_CATALOG.filter(c=>c.path!=='dew/qa.html');qs.textContent='항목 검사 중…';const res={items:{},patterns:{}};
 const jobs=[];const any=(w,d,n)=>both(w,d)||(n>14?lite(w,d):null);C.forEach(c=>{const src='../'+c.path;jobs.push(()=>load(src,1200,900,any));jobs.push(()=>load(src,375,812,(w,d,n)=>{const r=any(w,d,n);if(!r)return null;const e=d.documentElement;return {...r,docOverflowX:e.scrollWidth>e.clientWidth+1}}))});
 const out=await pool(jobs,6);const tb=document.getElementById('qc');let pass=0;
 C.forEach((c,i)=>{const a=out[i*2],b=out[i*2+1];const cs=a&&a.cases?a.cases:[];const rend=cs.filter(x=>x.rendered).length;const ok=a&&b&&(!cs.length||rend===cs.length)&&a.tokensLinked!==false&&!b.docOverflowX;if(ok)pass++;res.items[c.n]={path:c.path,loaded:!!a,cases:cs.length,rendered:rend,tokens:a?a.tokensLinked!==false:false,overflow1200:a?!!a.docOverflowX:null,overflow375:b?!!b.docOverflowX:null};
  tb.insertAdjacentHTML('beforeend','<tr><td>'+c.n+'</td><td>'+c.name+'</td><td><a href="../'+c.path+'">'+c.path.replace('dew/','')+'</a></td><td class="'+(a&&(!cs.length||rend===cs.length)?'dc-ok':'dc-bad')+'">'+(a?(cs.length?rend+' / '+cs.length:'page'):'로드 실패')+'</td><td class="'+(a&&a.tokensLinked!==false?'dc-ok':'dc-bad')+'">'+(a&&a.tokensLinked!==false?'OK':'—')+'</td><td class="'+(a&&!a.docOverflowX?'dc-ok':'dc-bad')+'">'+(a?(a.docOverflowX?'넘침':'OK'):'—')+'</td><td class="'+(b&&!b.docOverflowX?'dc-ok':'dc-bad')+'">'+(b?(b.docOverflowX?'넘침':'OK'):'—')+'</td></tr>')});
 qs.textContent='패턴 검사 중…';const pj=[],keys=[];PAT.forEach(([p,,ss])=>ss.forEach(s=>[1440,834,375].forEach(w=>{keys.push([p,s,w]);pj.push(()=>load('patterns/screen.html?p='+p+'&s='+s,w,900,x=>x.__DEW_PATTERN))})));
 const pr=await pool(pj,6);const tp=document.getElementById('qp');let pOk=0;
 PAT.forEach(([p,,ss])=>ss.forEach(s=>{const cells=[1440,834,375].map(w=>{const r=pr[keys.findIndex(k=>k[0]===p&&k[1]===s&&k[2]===w)];const g=r&&!r.overflowX&&r.s===s;if(g)pOk++;(res.patterns[p+':'+s]=res.patterns[p+':'+s]||{})[w]=r?(r.overflowX?'overflow':'ok'):'no-render';return '<td class="'+(g?'dc-ok':'dc-bad')+'">'+(r?(r.overflowX?'넘침':'OK'):'실패')+'</td>'}).join('');tp.insertAdjacentHTML('beforeend','<tr><td><a href="patterns/screen.html?p='+p+'&s='+s+'">'+p+' · '+s+'</a></td>'+cells+'</tr>')}));
 window.__DEW_QA=res;qs.textContent='완료 '+new Date().toLocaleString('ko-KR')+' · 항목 '+pass+'/'+C.length+' 통과 · 패턴 '+pOk+'/'+keys.length+' 무넘침';console.log('DEW-QA-DONE items '+pass+'/'+C.length+' patterns '+pOk+'/'+keys.length+' '+JSON.stringify(Object.entries(res.items).filter(([k,v])=>!(v.loaded&&v.rendered===v.cases&&v.tokens&&v.overflow375===false)).map(([k,v])=>k+':'+v.path+':'+JSON.stringify(v))))})();
</script></body></html>
