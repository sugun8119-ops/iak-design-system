<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOREX · Toasts</title><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.w{display:flex;flex-direction:column;gap:16px;max-width:1100px}.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.sw{border:1px solid var(--border-default);border-radius:4px;overflow:hidden;background:#fff}.sw i{display:block;height:64px}.sw div{padding:6px 8px;font:var(--text-caption)}.sw code{display:block;font:var(--text-code);font-size:11px;color:var(--fg-secondary)}.src{font:var(--text-caption);color:var(--fg-secondary)}</style></head><body><div class="w"><div class="ov">Components</div><ol style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px"><li class="kx-toast kx-toast--success"><span class="kx-toast-icon">●</span><div class="kx-toast-content"><div class="kx-toast-title">관심 매물에 저장했습니다.</div><div class="kx-toast-description">가상 예시 알림</div></div><button class="kx-toast-close" aria-label="닫기">✕</button></li><li class="kx-toast kx-toast--info"><span class="kx-toast-icon">●</span><div class="kx-toast-content"><div class="kx-toast-title">새 매물 3건이 등록되었습니다.</div><div class="kx-toast-description">가상 예시 알림</div></div><button class="kx-toast-close" aria-label="닫기">✕</button></li><li class="kx-toast kx-toast--warning"><span class="kx-toast-icon">●</span><div class="kx-toast-content"><div class="kx-toast-title">가격이 조정된 매물이 있습니다.</div><div class="kx-toast-description">가상 예시 알림</div></div><button class="kx-toast-close" aria-label="닫기">✕</button></li><li class="kx-toast kx-toast--error"><span class="kx-toast-icon">●</span><div class="kx-toast-content"><div class="kx-toast-title">상담 신청을 보내지 못했습니다.</div><div class="kx-toast-description">가상 예시 알림</div></div><button class="kx-toast-close" aria-label="닫기">✕</button></li></ol></div></body></html>
