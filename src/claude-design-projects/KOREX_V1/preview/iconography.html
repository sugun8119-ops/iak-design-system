<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOREX · Iconography</title><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.w{display:flex;flex-direction:column;gap:16px;max-width:1100px}.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.sw{border:1px solid var(--border-default);border-radius:4px;overflow:hidden;background:#fff}.sw i{display:block;height:64px}.sw div{padding:6px 8px;font:var(--text-caption)}.sw code{display:block;font:var(--text-code);font-size:11px;color:var(--fg-secondary)}.src{font:var(--text-caption);color:var(--fg-secondary)}</style></head><body><div class="w"><div class="ov">Brand</div><div class="row" style="gap:12px" id="ic"></div><p class="src">아이콘 모양은 자체 작성(derived-extension). 타일·heart 사용법은 observed. 전체: Master · Foundations › Icons</p><script src="../master/lib/kx-icons.js"></script><script>const s=n=>'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">'+KX_ICONS['kx:'+n].body+'</svg>';document.getElementById('ic').innerHTML=['factory','warehouse','building','store','land','layers'].map(n=>'<span class="kx-icon-tile">'+s(n)+'</span>').join('')+'<button class="heart" aria-pressed="false" aria-label="저장">'+s('heart')+'</button><button class="heart" aria-pressed="true" aria-label="저장됨">'+s('heart-fill')+'</button>'</script></div></body></html>
