<!-- @dsCard group="Spacing" viewport="1100x300" name="Glows → Emphasis layers" subtitle="KOREX has no glow; emphasis = green surfaces & mint tints" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOREX · Glows → Emphasis layers</title><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.w{display:flex;flex-direction:column;gap:16px;max-width:1100px}.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.sw{border:1px solid var(--border-default);border-radius:4px;overflow:hidden;background:#fff}.sw i{display:block;height:64px}.sw div{padding:6px 8px;font:var(--text-caption)}.sw code{display:block;font:var(--text-code);font-size:11px;color:var(--fg-secondary)}.src{font:var(--text-caption);color:var(--fg-secondary)}</style></head><body><div class="w"><div class="ov">Spacing</div><p>KOREX는 발광(glow) 효과를 쓰지 않습니다. 같은 목차 항목을 강조 레이어로 채웁니다.</p><div class="row" style="gap:16px"><div style="width:170px;height:90px;border-radius:6px;background:var(--state-hover);border:1px solid var(--border-default);padding:12px;color:inherit"><b style="font:var(--text-caption);font-weight:700">hover layer</b><br><code style="font:var(--text-code);font-size:11px">--state-hover</code></div><div style="width:170px;height:90px;border-radius:6px;background:var(--state-pressed);border:1px solid var(--border-default);padding:12px;color:inherit"><b style="font:var(--text-caption);font-weight:700">pressed layer</b><br><code style="font:var(--text-code);font-size:11px">--state-pressed</code></div><div style="width:170px;height:90px;border-radius:6px;background:var(--state-selected);border:1px solid var(--border-default);padding:12px;color:inherit"><b style="font:var(--text-caption);font-weight:700">selected (mint)</b><br><code style="font:var(--text-code);font-size:11px">--state-selected</code></div><div style="width:170px;height:90px;border-radius:6px;background:var(--state-dragging);border:1px solid var(--border-default);padding:12px;color:inherit"><b style="font:var(--text-caption);font-weight:700">dragging</b><br><code style="font:var(--text-code);font-size:11px">--state-dragging</code></div><div style="width:170px;height:90px;border-radius:6px;background:var(--bg-brand);border:1px solid var(--border-default);padding:12px;color:#fff"><b style="font:var(--text-caption);font-weight:700">brand emphasis</b><br><code style="font:var(--text-code);font-size:11px">--bg-brand</code></div></div></div></body></html>
