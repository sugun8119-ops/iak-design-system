<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOREX · Inputs</title><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.w{display:flex;flex-direction:column;gap:16px;max-width:1100px}.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.sw{border:1px solid var(--border-default);border-radius:4px;overflow:hidden;background:#fff}.sw i{display:block;height:64px}.sw div{padding:6px 8px;font:var(--text-caption)}.sw code{display:block;font:var(--text-code);font-size:11px;color:var(--fg-secondary)}.src{font:var(--text-caption);color:var(--fg-secondary)}</style></head><body><div class="w"><div class="ov">Components</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px"><div class="kx-field"><label>지역</label><input class="kx-input" placeholder="시·군·구 또는 산업단지"></div><div class="kx-field"><label>매물 유형</label><select class="kx-input"><option>창고</option></select></div><div class="kx-field"><label>이메일</label><input class="kx-input" aria-invalid="true" value="agent@korex"><p class="kx-help kx-error">올바른 이메일 형식이 아닙니다.</p></div><div class="kx-field"><label>매물번호</label><input class="kx-input" disabled value="KX-24-00318"></div></div><div class="row"><label class="kx-control"><input type="checkbox" checked><span>검증 매물만</span></label><label class="kx-control kx-switch"><input type="checkbox" role="switch" checked><span class="kx-switch-track"></span><span>가격 변동 알림</span></label></div></div></body></html>
