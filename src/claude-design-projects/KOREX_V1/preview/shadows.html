<!-- @dsCard group="Spacing" viewport="1100x300" name="Shadows" subtitle="none · raised · overlay (flat, derived)" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOREX · Shadows</title><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.w{display:flex;flex-direction:column;gap:16px;max-width:1100px}.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.sw{border:1px solid var(--border-default);border-radius:4px;overflow:hidden;background:#fff}.sw i{display:block;height:64px}.sw div{padding:6px 8px;font:var(--text-caption)}.sw code{display:block;font:var(--text-code);font-size:11px;color:var(--fg-secondary)}.src{font:var(--text-caption);color:var(--fg-secondary)}</style></head><body><div class="w"><div class="ov">Spacing</div><div class="row" style="gap:24px"><div style="width:220px;height:120px;background:#fff;border:1px solid var(--border-default);border-radius:6px;box-shadow:var(--shadow-none);padding:16px"><b>none</b><div class="muted" style="font:var(--text-caption)">카드 기본 (테두리만)</div><code style="font:var(--text-code);font-size:11px">--shadow-none</code></div><div style="width:220px;height:120px;background:#fff;border:1px solid var(--border-default);border-radius:6px;box-shadow:var(--shadow-raised);padding:16px"><b>raised</b><div class="muted" style="font:var(--text-caption)">드래그 중 블록</div><code style="font:var(--text-code);font-size:11px">--shadow-raised</code></div><div style="width:220px;height:120px;background:#fff;border:1px solid var(--border-default);border-radius:6px;box-shadow:var(--shadow-overlay);padding:16px"><b>overlay</b><div class="muted" style="font:var(--text-caption)">검색 패널·모달·메뉴</div><code style="font:var(--text-code);font-size:11px">--shadow-overlay</code></div></div></div></body></html>
