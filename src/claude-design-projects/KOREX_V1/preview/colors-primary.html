<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOREX · Colors · Primary (green)</title><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.w{display:flex;flex-direction:column;gap:16px;max-width:1100px}.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.sw{border:1px solid var(--border-default);border-radius:4px;overflow:hidden;background:#fff}.sw i{display:block;height:64px}.sw div{padding:6px 8px;font:var(--text-caption)}.sw code{display:block;font:var(--text-code);font-size:11px;color:var(--fg-secondary)}.src{font:var(--text-caption);color:var(--fg-secondary)}</style></head><body><div class="w"><div class="ov">Colors</div><div class="sws"><div class="sw"><i style="background:var(--kx-green-950)"></i><div>950<code>--kx-green-950</code></div></div><div class="sw"><i style="background:var(--kx-green-900)"></i><div>900 hero/sidebar<code>--kx-green-900</code></div></div><div class="sw"><i style="background:var(--kx-green-800)"></i><div>800 pressed<code>--kx-green-800</code></div></div><div class="sw"><i style="background:var(--kx-green-700)"></i><div>700 hover · text brand<code>--kx-green-700</code></div></div><div class="sw"><i style="background:var(--kx-green-600)"></i><div>600 action<code>--kx-green-600</code></div></div><div class="sw"><i style="background:var(--kx-green-500)"></i><div>500<code>--kx-green-500</code></div></div><div class="sw"><i style="background:var(--kx-green-400)"></i><div>400<code>--kx-green-400</code></div></div></div><script>document.querySelectorAll(".sw code").forEach(c=>c.textContent+=" "+getComputedStyle(document.documentElement).getPropertyValue(c.textContent).trim())</script><p class="src">역할: observed · hex: derived-design-value (source-observations.md)</p></div></body></html>
