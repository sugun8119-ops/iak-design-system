<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOREX · Chips & Status</title><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.w{display:flex;flex-direction:column;gap:16px;max-width:1100px}.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.sw{border:1px solid var(--border-default);border-radius:4px;overflow:hidden;background:#fff}.sw i{display:block;height:64px}.sw div{padding:6px 8px;font:var(--text-caption)}.sw code{display:block;font:var(--text-code);font-size:11px;color:var(--fg-secondary)}.src{font:var(--text-caption);color:var(--fg-secondary)}</style></head><body><div class="w"><div class="ov">Components</div><div class="chips"><button class="kx-button kx-button--chip kx-button--sm" aria-pressed="false"><span>전체</span></button><button class="kx-button kx-button--chip kx-button--sm" aria-pressed="false"><span>공장</span></button><button class="kx-button kx-button--chip kx-button--sm" aria-pressed="true"><span>창고</span></button><button class="kx-button kx-button--chip kx-button--sm" aria-pressed="false"><span>사무실</span></button><button class="kx-button kx-button--chip kx-button--sm" aria-pressed="false"><span>상가</span></button><button class="kx-button kx-button--chip kx-button--sm" aria-pressed="false"><span>토지</span></button></div><div class="row"><span class="kx-badge ">임대</span><span class="kx-badge kx-badge--success">검증 완료</span><span class="kx-badge kx-badge--info">신규</span><span class="kx-badge kx-badge--warning">가격 조정</span><span class="kx-badge kx-badge--error">거래 종료</span><span class="kx-badge kx-badge--brand">KOREX 추천</span></div><p class="src">pill 금지 일반규칙 철회 — 카테고리 chip은 원본처럼 pill. 상태 배지는 2px 사각(derived).</p></div></body></html>
