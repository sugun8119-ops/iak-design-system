<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOREX · Cards</title><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.w{display:flex;flex-direction:column;gap:16px;max-width:1100px}.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.sw{border:1px solid var(--border-default);border-radius:4px;overflow:hidden;background:#fff}.sw i{display:block;height:64px}.sw div{padding:6px 8px;font:var(--text-caption)}.sw code{display:block;font:var(--text-code);font-size:11px;color:var(--fg-secondary)}.src{font:var(--text-caption);color:var(--fg-secondary)}</style></head><body><div class="w"><div class="ov">Components</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px"><section class="kx-card"><h2>관심 매물</h2><div class="kpi">12</div><footer>3일 전 업데이트</footer></section><section class="kx-card kx-card--brand"><h2>이번 주 신규</h2><div class="kpi">148</div><footer>경기 남부</footer></section><section class="kx-card kx-card--mint"><h2>맞춤 추천</h2><p>조건 3개에 맞는 매물 7건</p></section></div><div class="lst"><div class="ph">매물 사진</div><div class="stack g8"><div class="row" style="gap:6px"><span class="kx-badge kx-badge--success">검증 완료</span><span class="kx-badge">창고</span></div><h3>평택 포승 물류창고 3,300㎡</h3><span class="muted">경기 평택시 · 층고 10m</span><span class="price">보증금 3억 / 월 2,100만</span></div><button class="heart" aria-pressed="false" aria-label="저장">♡</button></div></div></body></html>
