<!-- @dsCard group="Colors" viewport="1100x420" name="Colors · Semantic" subtitle="success · error · warning · info (derived-extension)" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOREX · Colors · Semantic</title><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.w{display:flex;flex-direction:column;gap:16px;max-width:1100px}.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.sw{border:1px solid var(--border-default);border-radius:4px;overflow:hidden;background:#fff}.sw i{display:block;height:64px}.sw div{padding:6px 8px;font:var(--text-caption)}.sw code{display:block;font:var(--text-code);font-size:11px;color:var(--fg-secondary)}.src{font:var(--text-caption);color:var(--fg-secondary)}</style></head><body><div class="w"><div class="ov">Colors</div><div class="sws"><div class="sw"><i style="background:var(--status-success)"></i><div>success<code>--status-success</code></div></div><div class="sw"><i style="background:var(--status-success-bg)"></i><div>success bg<code>--status-success-bg</code></div></div><div class="sw"><i style="background:var(--status-error)"></i><div>error<code>--status-error</code></div></div><div class="sw"><i style="background:var(--status-error-bg)"></i><div>error bg<code>--status-error-bg</code></div></div><div class="sw"><i style="background:var(--status-warning)"></i><div>warning<code>--status-warning</code></div></div><div class="sw"><i style="background:var(--status-warning-bg)"></i><div>warning bg<code>--status-warning-bg</code></div></div><div class="sw"><i style="background:var(--status-info)"></i><div>info<code>--status-info</code></div></div><div class="sw"><i style="background:var(--status-info-bg)"></i><div>info bg<code>--status-info-bg</code></div></div></div><script>document.querySelectorAll(".sw code").forEach(c=>c.textContent+=" "+getComputedStyle(document.documentElement).getPropertyValue(c.textContent).trim())</script><p class="src">원본 이미지에 상태 색은 보이지 않음 → derived-extension</p></div></body></html>
