<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOREX · Variant Stress Test</title><link rel="stylesheet" href="../styles.css"><style>.res{width:100%;border-collapse:collapse;font:var(--text-body)}.res th,.res td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border-default);vertical-align:top}.res th{font:var(--text-overline);color:var(--fg-secondary);background:var(--bg-subtle)}.res thead tr{border-top:2px solid var(--kx-green-900)}.ok{color:var(--kx-green-700);font-weight:700}.ng{color:var(--status-error);font-weight:700}.mc-scroll{overflow-x:auto}</style><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="../master/lib/kx-icons.js"></script><script src="../master/lib/kx-ui.js"></script><script src="../master/lib/kx-specs.js"></script></head><body><main class="mc"><header class="mc-head"><div class="ov">KOREX · QA</div><h1>변형 스트레스 테스트</h1><p>16개 컴포넌트 카드 정의(kx-specs.js)를 지금 읽어 케이스 수·태그·중복 id를 계산합니다.</p><div class="mc-meta" id="meta"></div></header><div class="mc-scroll"><table class="res"><thead><tr><th>컴포넌트</th><th>케이스</th><th>observed</th><th>preview-only</th><th>native/composition</th><th>긴 문구</th><th>중복 id</th></tr></thead><tbody id="tb"></tbody></table></div></main>
<script>const S=window.KX_SPECS||{};let tot=0,dup=0;const rows=Object.values(S).map(s=>{const cs=s.sections.flatMap(x=>x.cases);tot+=cs.length;const ids=cs.map(c=>c.id);const d=ids.length-new Set(ids).size;dup+=d;const n=t=>cs.filter(c=>c.tag===t).length;return '<tr><td><b>'+s.name+'</b></td><td>'+cs.length+'</td><td>'+n('observed')+'</td><td>'+n('preview-only')+'</td><td>'+(n('native')+n('composition'))+'</td><td>'+(ids.some(i=>/long/.test(i))?'✓':'—')+'</td><td class="'+(d?'ng':'ok')+'">'+d+'</td></tr>'});document.getElementById('tb').innerHTML=rows.join('');document.getElementById('meta').innerHTML='<code>components '+Object.keys(S).length+'</code><code>cases '+tot+'</code><code>duplicate ids '+dup+'</code>';</script></body></html>
