<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOREX · Docs UI · Document Site</title><link rel="stylesheet" href="../styles.css"><style>.md h2{font:var(--text-h2);margin:24px 0 8px}.md h3{font:var(--text-title);margin:20px 0 8px}.md h4{font:var(--text-body-strong);margin:16px 0 6px}.md p{margin:8px 0;color:var(--fg-primary);max-width:760px}.md ul{margin:8px 0;padding-left:20px}.md li{margin:4px 0}.md code{font:var(--text-code);background:var(--bg-subtle);padding:1px 5px;border-radius:2px}.md .mc-scroll{margin:12px 0}.md-code{background:var(--kx-green-950);color:var(--kx-mint-200);padding:16px;border-radius:4px;overflow:auto;font:var(--text-code);white-space:pre-wrap}.md-code code{background:none;padding:0;color:inherit}@media(max-width:640px){.dui{grid-template-columns:minmax(0,1fr)!important}.dui aside{display:none!important}.dui main{padding:24px 16px!important}}</style></head><body><div style="display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh" class="dui"><aside style="background:var(--bg-brand);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:16px"><span class="kx-wordmark">KOREX</span><small style="color:var(--kx-mint-200)">Docs</small><nav id="nav" class="ps-nav"></nav></aside><main style="padding:32px 40px;max-width:900px;min-width:0"><div class="md" id="doc"></div><section class="mc-sec" style="margin-top:32px"><header><h2>Playground</h2><p>버튼 variant를 바꿔 보세요 (실제 kx-ui.css).</p></header><div class="row" id="pg"></div><div class="kx-card" style="margin-top:12px"><div class="row" id="pv"></div></div></section></main></div><script src="../master/lib/kx-md.js"></script><script>const D=[["00-design-rulebook","디자인 규칙서"],["01-component-guide","컴포넌트 가이드"],["02-state-system","상태 시스템"],["03-layout-patterns","레이아웃 패턴"],["04-qa-checklist","QA 체크리스트"],["05-ai-prompt-guide","AI 생성 가이드"],["06-changelog","변경 기록"]];let cur=D[0][0];const nav=document.getElementById('nav');
function go(f){cur=f;nav.innerHTML=D.map(([k,t])=>'<a href="#'+k+'"'+(k===f?' aria-current="page"':'')+' data-k="'+k+'"><span>'+t+'</span></a>').join('');fetch(f+'.md').then(r=>r.text()).then(t=>{document.getElementById('doc').innerHTML=KXmd(t)})}
nav.onclick=e=>{const a=e.target.closest('a');if(a){e.preventDefault();go(a.dataset.k)}};go(cur);
const V=['primary','outline','chip','secondary','text'];let v='primary';const pg=document.getElementById('pg'),pv=document.getElementById('pv');function r(){pg.innerHTML=V.map(x=>'<button class="kx-button kx-button--chip kx-button--sm" aria-pressed="'+(x===v)+'" data-v="'+x+'"><span>'+x+'</span></button>').join('');pv.innerHTML='<button class="kx-button kx-button--'+v+' kx-button--md"><span>매물 검색</span></button><code style="font:var(--text-code)">&lt;Button variant="'+v+'"&gt;</code>'}pg.onclick=e=>{const b=e.target.closest('button');if(b){v=b.dataset.v;r()}};r();</script></body></html>
