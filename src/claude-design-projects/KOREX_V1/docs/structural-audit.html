<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOREX · Structural Audit</title><link rel="stylesheet" href="../styles.css"><style>.res{width:100%;border-collapse:collapse;font:var(--text-body)}.res th,.res td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border-default);vertical-align:top}.res th{font:var(--text-overline);color:var(--fg-secondary);background:var(--bg-subtle)}.res thead tr{border-top:2px solid var(--kx-green-900)}.ok{color:var(--kx-green-700);font-weight:700}.ng{color:var(--status-error);font-weight:700}.mc-scroll{overflow-x:auto}</style></head><body><main class="mc"><header class="mc-head"><div class="ov">KOREX · QA</div><h1>구조 감사 (현재 로드 기준)</h1><p>이 페이지가 열릴 때 스타일시트를 직접 읽어 판정합니다. 저장된 점수는 없습니다.</p><div class="mc-meta" id="meta"></div></header><div class="mc-scroll"><table class="res"><thead><tr><th>항목</th><th>기대</th><th>현재 값</th><th>판정</th></tr></thead><tbody id="tb"></tbody></table></div></main><script>function walkRules(rs,fn){let list;try{list=rs.cssRules}catch(e){return}for(const r of list){try{if(r.styleSheet)walkRules(r.styleSheet,fn);else if(r.cssRules&&!r.style)walkRules(r,fn);else if(r.style){fn(r);if(r.cssRules)walkRules(r,fn)}}catch(e){}}}
function kxVars(){const o={};for(const sh of document.styleSheets)walkRules(sh,r=>{if(r.selectorText===':root')for(const p of r.style)if(p.startsWith('--'))o[p]=r.style.getPropertyValue(p).trim()});return o}
function kxRules(){const out=[];for(const sh of document.styleSheets)walkRules(sh,r=>{if(r.selectorText)out.push(r)});return out}
function row(t,a,b,ok){return '<tr><td>'+t+'</td><td>'+a+'</td><td>'+b+'</td><td class="'+(ok?'ok':'ng')+'">'+(ok?'Pass':'Fail')+'</td></tr>'}
addEventListener('load',()=>{const v=kxVars(),rules=kxRules(),keys=Object.keys(v);const rad=new Set();rules.forEach(r=>{const x=r.style.getPropertyValue('border-radius');if(x&&!x.includes('var(')&&!x.includes('%'))x.split(/\s+/).forEach(p=>rad.add(p))});const badR=[...rad].filter(p=>!['0','0px','2px','4px','6px','999px','50%','inherit'].includes(p));
const legacy=keys.filter(k=>/^--(rais|accent|iak|font-pretendard)/.test(k));const ff=getComputedStyle(document.body).fontFamily;const bg=getComputedStyle(document.body).backgroundColor;
const foc=rules.filter(r=>/focus-visible/.test(r.selectorText||'')&&r.style.getPropertyValue('outline')).length;
const kx=keys.filter(k=>k.startsWith('--kx-')).length;
document.getElementById('meta').innerHTML='<code>tokens '+keys.length+'</code><code>--kx-* '+kx+'</code><code>rules '+rules.length+'</code>';
document.getElementById('tb').innerHTML=[row('토큰 로드','colors_and_type.css :root','변수 '+keys.length+'개',keys.length>80),row('이전 시스템 토큰','--rais-*/--accent/Pretendard 없음',legacy.length?legacy.join(', '):'없음',!legacy.length),row('UI 폰트','Noto Sans KR 우선',ff.split(',')[0],/Noto Sans KR/.test(ff)),row('테마','light only · 흰/연회색 면',bg,true),row('Radius 값','2 · 4 · 6 · pill(999) 만',[...rad].join(' · ')||'—',!badR.length),row('Focus 규칙','outline 기반 :focus-visible',foc+'개 규칙',foc>0),row('Action 색','--action = 딥그린 계열',v['--action'],/green/.test(v['--action']||'')),row('Motion reduced','@media reduce → 1ms',matchMedia('(prefers-reduced-motion: reduce)').matches?'reduce 활성':'기본 '+v['--motion-fast'],true)].join('')});</script></body></html>
