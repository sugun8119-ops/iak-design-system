<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOREX · Regeneration Stability</title><link rel="stylesheet" href="../styles.css"><style>.res{width:100%;border-collapse:collapse;font:var(--text-body)}.res th,.res td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border-default);vertical-align:top}.res th{font:var(--text-overline);color:var(--fg-secondary);background:var(--bg-subtle)}.res thead tr{border-top:2px solid var(--kx-green-900)}.ok{color:var(--kx-green-700);font-weight:700}.ng{color:var(--status-error);font-weight:700}.mc-scroll{overflow-x:auto}#tmp{position:absolute;left:-9999px;top:0;width:1200px}</style><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="../master/lib/kx-icons.js"></script><script src="../master/lib/kx-ui.js"></script><script src="../master/lib/kx-specs.js"></script></head><body><main class="mc"><header class="mc-head"><div class="ov">KOREX · QA</div><h1>재생성 안정성</h1><p>같은 spec을 두 번 독립 렌더해 마크업이 동일한지 비교합니다 (id·시간 의존 속성 정규화). 저장 점수 없음.</p><div class="mc-meta" id="meta"></div></header><div class="mc-scroll"><table class="res"><thead><tr><th>컴포넌트</th><th>렌더 A 길이</th><th>렌더 B 길이</th><th>판정</th></tr></thead><tbody id="tb"><tr><td colspan="4">렌더 중…</td></tr></tbody></table></div><div id="tmp" aria-hidden="true"></div></main>
<script>const h=React.createElement,S=window.KX_SPECS||{},tmp=document.getElementById('tmp');const norm=s=>s.replace(/\s(id|for|aria-labelledby|aria-describedby|aria-controls)="[^"]*"/g,'');
function once(spec){return new Promise(res=>{const el=document.createElement('div');tmp.appendChild(el);const r=ReactDOM.createRoot(el);r.render(h('div',null,spec.sections.flatMap(s=>s.cases).map(c=>h('div',{key:c.id},c.el))));setTimeout(()=>{const m=norm(el.innerHTML);r.unmount();el.remove();res(m)},120)})}
(async()=>{let ok=0;const out=[];for(const s of Object.values(S)){const a=await once(s),b=await once(s);const same=a===b;if(same)ok++;out.push('<tr><td><b>'+s.name+'</b></td><td>'+a.length+'</td><td>'+b.length+'</td><td class="'+(same?'ok':'ng')+'">'+(same?'동일':'차이')+'</td></tr>')}document.getElementById('tb').innerHTML=out.join('');document.getElementById('meta').innerHTML='<code>동일 '+ok+' / '+out.length+'</code>'})();</script></body></html>
