<!-- @dsCard group="Master · Foundations" viewport="1200x820" name="Icons · KOREX line set" subtitle="Self-authored 24px line icons (derived-extension) · mint tile + outline heart (observed usage)" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOREX · Icons</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="../lib/kx-icons.js"></script><script src="../lib/kx-ui.js"></script></head><body><main class="mc"><header class="mc-head"><div class="ov">KOREX · Foundations</div><h1>Icons</h1><p>원본 아이콘은 재사용하지 않고 24 그리드, 1.75 stroke, round cap의 선형 아이콘을 자체 작성했습니다(derived-extension). 원본에서 관찰된 것은 <b>사용 방식</b>뿐입니다: 연민트 사각 타일, outline heart.</p><div class="mc-meta" id="m"></div></header>
<section class="mc-sec"><header><h2>사용 규칙</h2></header><div class="mc-grid" id="use"></div></section><section class="mc-sec"><header><h2>전체</h2></header><div class="mc-grid" id="all" style="grid-template-columns:repeat(auto-fill,minmax(128px,1fr))"></div></section></main>
<script>const I=window.KX_ICONS,svg=(n,s=24)=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n].body+'</svg>';const ks=Object.keys(I);document.getElementById('m').innerHTML='<code>'+ks.length+' icons</code><code>kx:* namespace</code><code>16 / 20 / 24 px</code>';
document.getElementById('use').innerHTML=[['연민트 사각 타일 (observed)','<span class="kx-icon-tile">'+svg('kx:factory')+'</span><span class="kx-icon-tile">'+svg('kx:warehouse')+'</span>','observed'],['outline heart (observed)','<button class="heart" aria-pressed="false" aria-label="저장">'+svg('kx:heart',20)+'</button><button class="heart" aria-pressed="true" aria-label="저장됨">'+svg('kx:heart-fill',20)+'</button>','observed'],['버튼 안 16–18px','<span class="kx-button kx-button--primary kx-button--md"><span>'+svg('kx:search',18)+'매물 검색</span></span>','code']].map(([l,e,t])=>'<figure class="mc-case"><div class="mc-demo">'+e+'</div><figcaption class="mc-cap"><span>'+l+'</span><span class="mc-tag" data-t="'+t+'">'+t+'</span></figcaption></figure>').join('');
document.getElementById('all').innerHTML=ks.map(k=>'<figure class="mc-case" style="align-items:center;text-align:center;padding:12px"><div class="mc-demo" style="justify-content:center">'+svg(k)+'</div><figcaption class="mc-cap" style="justify-content:center"><code style="font:var(--text-code);font-size:11px">'+k.slice(3)+'</code></figcaption></figure>').join('');</script></body></html>
