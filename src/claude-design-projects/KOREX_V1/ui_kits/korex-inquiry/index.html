<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOREX · KOREX 문의·AI 도우미</title><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--bg-canvas)}.kit{display:flex;flex-direction:column;gap:16px;padding:20px var(--container-pad);max-width:1480px;margin:0 auto}.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}.bar h1{font:var(--text-h2);margin:0}.bar p{margin:4px 0 0;color:var(--fg-secondary);font:var(--text-caption)}.tabs,.sts{display:flex;flex-wrap:wrap;gap:8px}.frame{border:1px solid var(--border-default);border-radius:6px;overflow:hidden;background:#fff}.frame iframe{display:block;width:100%;height:760px;border:0}</style></head><body><div class="kit"><div class="bar"><div><div class="ov">KOREX · UI Kit</div><h1>KOREX 문의·AI 도우미</h1><p>고객 문의 응대 초안, 매물 페이지 구성, 공동중개 확인 흐름 (파생 확장).</p></div><div class="stack g8"><div class="tabs" id="tabs" role="group" aria-label="화면"></div><div class="sts" id="sts" role="group" aria-label="상태"></div></div></div><div class="frame"><iframe id="fr" title="KOREX 문의·AI 도우미 미리보기"></iframe></div></div><script>const SC=[["chat","AI 도우미",["default","streaming","empty","error"]],["builder","페이지 구성",["default","selected","dragging","empty"]],["modal","확인 모달",["dialog","confirm","pending","error"]],["billing","광고 결제",["default","loading","error","empty"]]];const P=window.parent===window?null:null;let cur=SC[0][0];const tabs=document.getElementById('tabs'),sts=document.getElementById('sts'),fr=document.getElementById('fr');const ST={};
function btn(l,sel,on){const b=document.createElement('button');b.type='button';b.className='kx-button kx-button--chip kx-button--sm';b.setAttribute('aria-pressed',sel);b.innerHTML='<span></span>';b.firstChild.textContent=l;b.onclick=on;return b}
function draw(){tabs.replaceChildren(...SC.map(([id,l])=>btn(l,id===cur,()=>{cur=id;draw()})));const s=SC.find(x=>x[0]===cur);const states=s[2];ST[cur]=ST[cur]||states[0];sts.replaceChildren(...states.map(x=>btn(x,x===ST[cur],()=>{ST[cur]=x;draw()})));const u='../../master/patterns/screen.html?p='+cur+'&s='+ST[cur];if(fr.getAttribute('src')!==u)fr.setAttribute('src',u)}draw();</script></body></html>
