<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOREX · KOREX 파트너 콘솔</title><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--bg-canvas)}.kit{display:flex;flex-direction:column;gap:16px;padding:20px var(--container-pad);max-width:1480px;margin:0 auto}.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}.bar h1{font:var(--text-h2);margin:0}.bar p{margin:4px 0 0;color:var(--fg-secondary);font:var(--text-caption)}.tabs,.sts{display:flex;flex-wrap:wrap;gap:8px}.frame{border:1px solid var(--border-default);border-radius:6px;overflow:hidden;background:#fff}.frame iframe{display:block;width:100%;height:760px;border:0}</style></head><body><div class="kit"><div class="bar"><div><div class="ov">KOREX · UI Kit</div><h1>KOREX 파트너 콘솔</h1><p>중개사무소가 매물을 등록·관리하는 콘솔 (원본에 없는 파생 확장).</p></div><div class="stack g8"><div class="tabs" id="tabs" role="group" aria-label="화면"></div><div class="sts" id="sts" role="group" aria-label="상태"></div></div></div><div class="frame"><iframe id="fr" title="KOREX 파트너 콘솔 미리보기"></iframe></div></div><script>const SC=[["dashboard","Dashboard",["default","loading","empty","error"]],["table","매물 관리",["default","loading","empty","error","long-text"]],["detail","매물 상세",["default","loading","missing-data","error"]],["settings","설정",["default","saving","error","success"]]];const P=window.parent===window?null:null;let cur=SC[0][0];const tabs=document.getElementById('tabs'),sts=document.getElementById('sts'),fr=document.getElementById('fr');const ST={};
function btn(l,sel,on){const b=document.createElement('button');b.type='button';b.className='kx-button kx-button--chip kx-button--sm';b.setAttribute('aria-pressed',sel);b.innerHTML='<span></span>';b.firstChild.textContent=l;b.onclick=on;return b}
function draw(){tabs.replaceChildren(...SC.map(([id,l])=>btn(l,id===cur,()=>{cur=id;draw()})));const s=SC.find(x=>x[0]===cur);const states=s[2];ST[cur]=ST[cur]||states[0];sts.replaceChildren(...states.map(x=>btn(x,x===ST[cur],()=>{ST[cur]=x;draw()})));const u='../../master/patterns/screen.html?p='+cur+'&s='+ST[cur];if(fr.getAttribute('src')!==u)fr.setAttribute('src',u)}draw();</script></body></html>
