<!-- @dsCard group="Brand" viewport="1200x900" name="Documentation viewer" subtitle="7 KOREX docs as accordion HTML (live-rendered from docs/*.md)" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOREX · Documentation viewer</title><link rel="stylesheet" href="styles.css"><style>.md h2{font:var(--text-h2);margin:24px 0 8px}.md h3{font:var(--text-title);margin:20px 0 8px}.md h4{font:var(--text-body-strong);margin:16px 0 6px}.md p{margin:8px 0;color:var(--fg-primary);max-width:760px}.md ul{margin:8px 0;padding-left:20px}.md li{margin:4px 0}.md code{font:var(--text-code);background:var(--bg-subtle);padding:1px 5px;border-radius:2px}.md .mc-scroll{margin:12px 0}.md-code{background:var(--kx-green-950);color:var(--kx-mint-200);padding:16px;border-radius:4px;overflow:auto;font:var(--text-code);white-space:pre-wrap}.md-code code{background:none;padding:0;color:inherit}details[open]>summary{border-bottom:1px solid var(--border-default);margin-bottom:8px;color:var(--fg-brand)}</style></head><body><main class="mc"><header class="mc-head"><div class="ov">KOREX · Docs</div><h1>문서</h1><p>docs/*.md를 실시간으로 읽어 렌더합니다. 원문 마크다운은 노출하지 않습니다.</p></header><div class="stack g8" id="acc"></div></main><script src="master/lib/kx-md.js"></script><script>const D=[["00-design-rulebook","디자인 규칙서"],["01-component-guide","컴포넌트 가이드"],["02-state-system","상태 시스템"],["03-layout-patterns","레이아웃 패턴"],["04-qa-checklist","QA 체크리스트"],["05-ai-prompt-guide","AI 생성 가이드"],["06-changelog","변경 기록"]];const acc=document.getElementById('acc');
acc.innerHTML=D.map(([f,t],i)=>'<details class="kx-card" style="gap:0;padding:0"'+(i===0?' open':'')+'><summary style="padding:18px 24px;cursor:pointer;font:var(--text-title);list-style-position:inside">'+String(i).padStart(2,'0')+' · '+t+'</summary><div class="md" style="padding:0 24px 24px" data-f="'+f+'">불러오는 중…</div></details>').join('');
acc.querySelectorAll('[data-f]').forEach(el=>fetch('docs/'+el.dataset.f+'.md').then(r=>r.text()).then(t=>{el.innerHTML=KXmd(t)}).catch(()=>{el.textContent='문서를 불러오지 못했습니다.'}));</script></body></html>
