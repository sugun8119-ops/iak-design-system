<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Grey scale" subtitle="100 → 1000" viewport="700x160" --><html><head><meta charset="utf-8"><title>Color · Grey scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--bg-elevated);font:var(--text-body);color:var(--fg-primary)}
  h4{margin:0 0 12px;font:var(--text-body-strong);color:var(--fg-strong)}
  .row{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;align-items:end}
  .sw{height:88px;border-radius:8px;border:1px solid var(--border-default)}
  .lbl{font:var(--text-caption);color:var(--fg-secondary);text-align:center;margin-top:8px;font-feature-settings:"tnum"}
</style></head>
<body>
<h4>Grey scale — 100 → 1000</h4>
<div class="row">
  <div><div class="sw" style="background:var(--rais-grey-100)"></div><div class="lbl">100</div></div>
  <div><div class="sw" style="background:var(--rais-grey-200)"></div><div class="lbl">200</div></div>
  <div><div class="sw" style="background:var(--rais-grey-300)"></div><div class="lbl">300</div></div>
  <div><div class="sw" style="background:var(--rais-grey-400)"></div><div class="lbl">400</div></div>
  <div><div class="sw" style="background:var(--rais-grey-500)"></div><div class="lbl">500</div></div>
  <div><div class="sw" style="background:var(--rais-grey-600)"></div><div class="lbl">600</div></div>
  <div><div class="sw" style="background:var(--rais-grey-700)"></div><div class="lbl">700</div></div>
  <div><div class="sw" style="background:var(--rais-grey-800)"></div><div class="lbl">800</div></div>
  <div><div class="sw" style="background:var(--rais-grey-1000)"></div><div class="lbl">1000</div></div>
</div>
</body></html>
