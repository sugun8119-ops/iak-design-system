<!doctype html>
<!-- @dsCard group="Spacing" name="Glows" subtitle="Colored umbra under accent surfaces" viewport="700x170" --><html><head><meta charset="utf-8"><title>Glows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:32px 24px;background:var(--bg-elevated);color:var(--fg-primary)}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
  .glow{height:72px;border-radius:8px;display:flex;align-items:flex-end;padding:8px 10px;font:var(--text-caption);color:var(--fg-on-accent);font-weight:700}
  .lbl{font:var(--text-overline);color:var(--fg-muted);text-align:center;margin-top:10px;letter-spacing:.1em}
</style></head>
<body>
<div class="row">
  <div><div class="glow" style="background:var(--rais-primary);box-shadow:var(--glow-primary)">PRIMARY</div><div class="lbl">--glow-primary</div></div>
  <div><div class="glow" style="background:var(--rais-info);box-shadow:var(--glow-info);color:#fff">INFO</div><div class="lbl">--glow-info</div></div>
  <div><div class="glow" style="background:var(--rais-success);box-shadow:var(--glow-success);color:#fff">SUCCESS</div><div class="lbl">--glow-success</div></div>
  <div><div class="glow" style="background:var(--rais-warning);box-shadow:var(--glow-warning)">WARNING</div><div class="lbl">--glow-warning</div></div>
  <div><div class="glow" style="background:var(--rais-error);box-shadow:var(--glow-error);color:#fff">ERROR</div><div class="lbl">--glow-error</div></div>
</div>
</body></html>
