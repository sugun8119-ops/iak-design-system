<!doctype html>
<!-- @dsCard group="Spacing" name="Shadows" subtitle="Card · Soft · Toast" viewport="700x170" --><html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-elevated);color:var(--fg-primary)}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .card{height:96px;border-radius:12px;background:var(--bg-card);display:flex;align-items:center;justify-content:center;font:var(--text-overline);color:var(--fg-secondary);letter-spacing:.1em}
</style></head>
<body>
<div class="row">
  <div class="card" style="box-shadow:var(--shadow-card)">CARD</div>
  <div class="card" style="box-shadow:var(--shadow-soft)">SOFT</div>
  <div class="card" style="box-shadow:var(--shadow-toast)">TOAST</div>
</div>
</body></html>
