<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing" subtitle="4-px base scale" viewport="700x340" --><html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--bg-elevated);color:var(--fg-primary)}
  .row{display:flex;flex-direction:column;gap:8px}
  .bar{height:18px;background:var(--rais-primary);border-radius:3px}
  .item{display:grid;grid-template-columns:60px 1fr 60px;gap:12px;align-items:center}
  .tok{font:var(--text-overline);letter-spacing:.1em;color:var(--fg-muted)}
  .px{font:var(--text-caption);color:var(--fg-secondary);text-align:right;font-feature-settings:"tnum"}
</style></head>
<body>
<div class="row">
  <div class="item"><span class="tok">1</span><div class="bar" style="width:4px"></div><span class="px">4 px</span></div>
  <div class="item"><span class="tok">2</span><div class="bar" style="width:8px"></div><span class="px">8 px</span></div>
  <div class="item"><span class="tok">3</span><div class="bar" style="width:12px"></div><span class="px">12 px</span></div>
  <div class="item"><span class="tok">4</span><div class="bar" style="width:16px"></div><span class="px">16 px</span></div>
  <div class="item"><span class="tok">6</span><div class="bar" style="width:24px"></div><span class="px">24 px</span></div>
  <div class="item"><span class="tok">8</span><div class="bar" style="width:32px"></div><span class="px">32 px</span></div>
  <div class="item"><span class="tok">10</span><div class="bar" style="width:40px"></div><span class="px">40 px</span></div>
  <div class="item"><span class="tok">12</span><div class="bar" style="width:48px"></div><span class="px">48 px</span></div>
  <div class="item"><span class="tok">16</span><div class="bar" style="width:64px"></div><span class="px">64 px</span></div>
</div>
</body></html>
