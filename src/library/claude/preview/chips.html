<!doctype html>
<!-- @dsCard group="Components" name="Chips & Status" subtitle="Soft chips + status dots" viewport="700x140" --><html><head><meta charset="utf-8"><title>Chips & Status</title>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--bg-elevated);color:var(--fg-primary)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .row:last-child{margin-bottom:0}
  .chip{height:24px;padding:0 10px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;font:var(--text-overline);letter-spacing:.06em;text-transform:none}
  .chip.primary{background:rgba(255,167,38,0.16);color:var(--accent)}
  .chip.info{background:rgba(76,154,236,0.16);color:var(--rais-info-light)}
  .chip.success{background:rgba(51,196,136,0.16);color:var(--rais-success-lighter)}
  .chip.warning{background:rgba(250,174,62,0.16);color:var(--rais-warning)}
  .chip.error{background:rgba(255,102,91,0.16);color:var(--rais-error-light)}
  .chip.default{background:var(--rais-alpha-12);color:var(--fg-secondary)}
  .dot{width:8px;height:8px;border-radius:500px}
  .lbl{font:var(--text-overline);color:var(--fg-muted);width:64px;letter-spacing:.1em}
</style></head>
<body>
  <div class="row"><span class="lbl">CHIPS</span>
    <span class="chip default">All</span>
    <span class="chip primary">Active</span>
    <span class="chip info">Mason</span>
    <span class="chip success">Online</span>
    <span class="chip warning">Pending</span>
    <span class="chip error">Failed</span>
  </div>
  <div class="row"><span class="lbl">STATUS</span>
    <span style="display:inline-flex;align-items:center;gap:6px;font:var(--text-caption)"><span class="dot" style="background:var(--rais-success-light);box-shadow:0 0 0 3px rgba(39,218,104,0.2)"></span>Online</span>
    <span style="display:inline-flex;align-items:center;gap:6px;font:var(--text-caption)"><span class="dot" style="background:var(--rais-warning)"></span>Idle</span>
    <span style="display:inline-flex;align-items:center;gap:6px;font:var(--text-caption)"><span class="dot" style="background:var(--rais-error)"></span>Offline</span>
    <span style="display:inline-flex;align-items:center;gap:6px;font:var(--text-caption)"><span class="dot" style="background:var(--fg-muted)"></span>Unknown</span>
  </div>
</body></html>
