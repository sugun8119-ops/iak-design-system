<!doctype html>
<!-- @dsCard group="Spacing" name="Radii" subtitle="4 / 6 / 8 / 12 / 16 / 24 / pill" viewport="700x160" --><html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--bg-elevated);color:var(--fg-primary)}
  .row{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;align-items:end}
  .box{background:var(--bg-field);border:1px solid var(--border-default);height:80px;display:flex;align-items:center;justify-content:center;color:var(--fg-secondary);font:var(--text-caption);font-feature-settings:"tnum"}
  .lbl{font:var(--text-overline);color:var(--rais-primary);text-align:center;margin-top:8px;letter-spacing:.08em}
</style></head>
<body>
<div class="row">
  <div><div class="box" style="border-radius:var(--radius-xs)">4</div><div class="lbl">XS</div></div>
  <div><div class="box" style="border-radius:var(--radius-sm)">6</div><div class="lbl">SM</div></div>
  <div><div class="box" style="border-radius:var(--radius-md)">8</div><div class="lbl">MD</div></div>
  <div><div class="box" style="border-radius:var(--radius-lg)">12</div><div class="lbl">LG</div></div>
  <div><div class="box" style="border-radius:var(--radius-xl)">16</div><div class="lbl">XL</div></div>
  <div><div class="box" style="border-radius:var(--radius-2xl)">24</div><div class="lbl">2XL</div></div>
  <div><div class="box" style="border-radius:var(--radius-pill);width:80px;height:80px;margin:0 auto">●</div><div class="lbl">PILL</div></div>
</div>
</body></html>
