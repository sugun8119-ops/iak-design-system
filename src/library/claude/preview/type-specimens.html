<!doctype html>
<!-- @dsCard group="Type" name="Type · Specimens" subtitle="Roboto · Barlow · Public Sans" viewport="700x210" --><html><head><meta charset="utf-8"><title>Type · Specimens</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px;background:var(--bg-elevated);color:var(--fg-primary)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .card{padding:18px;border-radius:12px;border:1px solid var(--border-default);background:var(--bg-card)}
  .name{font:var(--text-overline);color:var(--rais-primary);letter-spacing:.12em}
  .aa{font-size:72px;line-height:1;margin:10px 0 8px;color:var(--fg-strong)}
  .meta{font:var(--text-caption);color:var(--fg-secondary)}
  .ko{font-size:34px;line-height:1.1;color:var(--fg-primary);margin-top:6px}
</style></head>
<body>
<div class="grid">
  <div class="card"><div class="name">DISPLAY · 800</div><div class="aa" style="font-weight:800">Aa</div><div class="ko" style="font-weight:800">디자인</div><div class="meta">Pretendard ExtraBold · hero numerals</div></div>
  <div class="card"><div class="name">TITLE · 700</div><div class="aa" style="font-weight:700">Aa</div><div class="ko" style="font-weight:700">디자인</div><div class="meta">Pretendard Bold · page + section titles</div></div>
  <div class="card"><div class="name">CARD · 600</div><div class="aa" style="font-weight:600">Aa</div><div class="ko" style="font-weight:600">디자인</div><div class="meta">Pretendard SemiBold · card titles, buttons</div></div>
  <div class="card"><div class="name">BODY · 400</div><div class="aa" style="font-weight:400">Aa</div><div class="ko" style="font-weight:400">디자인</div><div class="meta">Pretendard Regular · body, captions</div></div>
</div>
</body></html>
