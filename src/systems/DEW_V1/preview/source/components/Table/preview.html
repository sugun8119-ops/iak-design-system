<!-- @dsCard group="Data" height=2300 subtitle="sort · loading · empty · error · missing · long · narrow" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table — DEW_V1</title></head>
<body>
<div id="root"></div>
<script>
  var D = window.DEW, h = React.createElement;
  function L(t) { return h('span', { className: 'dew-meta dew-pv-label' }, t); }
  function C(t, node, style) { return h('div', { className: 'dew-pv-cell', style: style }, L(t), node); }
  function H(t) { return h('p', { className: 'dew-meta dew-eyebrow dew-pv-h' }, t); }
  function G(cells, wide) { return h('div', { className: 'dew-pv-grid' + (wide ? ' dew-pv-grid--wide' : '') }, cells); }
  function K(list) { return list.map(function (n, i) { return h(React.Fragment, { key: i }, n); }); }

  var cols = [{ key: 'title', label: '제목', sortable: true }, { key: 'topic', label: '주제', sortable: true }, { key: 'issue', label: '호', sortable: true, align: 'end' }, { key: 'time', label: '읽기', align: 'end' }];
  var rows = [
    { id: 1, title: '느린 오후의 색', topic: 'CULTURE', issue: '예시 02', time: '3분' },
    { id: 2, title: '사물 사이의 여백', topic: 'OBJECTS', issue: '예시 01', time: '5분', selected: true },
    { id: 3, title: '걷다 만난 작은 풍경', topic: 'PLACES', issue: null, time: '' }
  ];
  var longRows = [{ id: 1, title: 'A remarkably long English title about the quiet hours between two seasons — 두 계절 사이의 조용한 시간에 관한 아주 긴 제목', topic: 'CULTURE & OBJECTS', issue: '예시 12', time: '14분' }];
  var VIEW = [
    H('SORTED (제목 ↑) · SELECTED ROW · MISSING VALUES'),
    h(D.Table, { caption: '저널 목록', summary: '예시 데이터 3건', columns: cols, rows: rows, sort: { key: 'title', direction: 'asc' }, onSort: function () {} }),
    H('LOADING'), h(D.Table, { caption: '저널 목록', columns: cols, state: 'loading' }),
    H('EMPTY'), h(D.Table, { caption: '저널 목록', columns: cols, state: 'empty', emptyAction: h(D.Button, { variant: 'secondary', size: 'sm' }, '필터 초기화') }),
    H('ERROR'), h(D.Table, { caption: '저널 목록', columns: cols, state: 'error', onRetry: function () {} }),
    H('LONG COPY'), h(D.Table, { caption: '긴 문구', columns: cols, rows: longRows, sort: { key: 'issue', direction: 'desc' } }),
    H('NARROW — 343px container, horizontal scroll region'),
    h('div', { style: { maxWidth: '343px', border: '1px dashed var(--border)', padding: '8px' } }, h(D.Table, { caption: '좁은 화면', columns: cols, rows: rows, minWidth: 560 }))
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'dew dew-pv' }, K(VIEW)));
</script>
</body>
</html>
