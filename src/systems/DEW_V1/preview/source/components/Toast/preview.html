<!-- @dsCard group="Status" height=760 subtitle="info · success · warning · error · action · long" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toast — DEW_V1</title></head>
<body>
<div id="root"></div>
<script>
  var D = window.DEW, h = React.createElement;
  function L(t) { return h('span', { className: 'dew-meta dew-pv-label' }, t); }
  function C(t, node, style) { return h('div', { className: 'dew-pv-cell', style: style }, L(t), node); }
  function H(t) { return h('p', { className: 'dew-meta dew-eyebrow dew-pv-h' }, t); }
  function G(cells, wide) { return h('div', { className: 'dew-pv-grid' + (wide ? ' dew-pv-grid--wide' : '') }, cells); }
  function K(list) { return list.map(function (n, i) { return h(React.Fragment, { key: i }, n); }); }

  var VIEW = [G(K([
    C('info', h(D.Toast, { tone: 'info', title: '새 이야기가 올라왔습니다', message: '목록을 새로 고치면 볼 수 있습니다.', onClose: function () {} })),
    C('success', h(D.Toast, { tone: 'success', title: '보관함에 저장했습니다', action: { label: '되돌리기' }, onClose: function () {} })),
    C('warning', h(D.Toast, { tone: 'warning', title: '연결이 느립니다', message: '이미지를 낮은 화질로 불러옵니다.', onClose: function () {} })),
    C('error', h(D.Toast, { tone: 'error', title: '저장하지 못했습니다', message: '네트워크를 확인한 뒤 다시 시도해 주세요.', action: { label: '다시 시도' }, onClose: function () {} })),
    C('long · KO+EN', h(D.Toast, { tone: 'info', title: 'Your reading list has been synced across devices — 모든 기기에 읽기 목록이 동기화되었습니다', message: '긴 문구도 줄바꿈되며 닫기 버튼과 겹치지 않습니다.', onClose: function () {} })),
    C('stack (ToastRegion inline)', h(D.ToastRegion, { inline: true }, h(D.Toast, { tone: 'success', title: '저장했습니다' }), h(D.Toast, { tone: 'error', title: '일부 이미지를 불러오지 못했습니다' })))
  ]), true)];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'dew dew-pv' }, K(VIEW)));
</script>
</body>
</html>
