<!-- @dsCard group="Search" height=380 -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>preview</title></head>
<body style="margin:0;background:var(--canvas);padding:24px">
<div id="root"></div>
<script>
  var K = window.KOREX, h = React.createElement;
  var col = function (gap) { return { style: { display: 'flex', flexDirection: 'column', gap: gap || 24 } }; };
  var row = function (gap) { return { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: gap || 24 } }; };
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', col(40),
      h(K.FilterPanel, { label: '제품 종류 — Default', count: 3, countLabel: function (n) { return n + '개 예시 제품'; },
        options: [{ value: 'all', label: '전체' }, { value: 'seating', label: '체어' }, { value: 'tables', label: '테이블' }, { value: 'lighting', label: '조명' }] }),
      h(K.FilterPanel, { label: '제품 종류 — Active', defaultValue: 'tables', count: 1, countLabel: function (n) { return n + '개 예시 제품'; },
        options: [{ value: 'all', label: '전체' }, { value: 'seating', label: '체어' }, { value: 'tables', label: '테이블' }, { value: 'lighting', label: '조명' }] }),
      h(K.FilterPanel, { label: '제품 종류 — Empty', defaultValue: 'lighting', count: 0, countLabel: function (n) { return n + '개 예시 제품'; },
        options: [{ value: 'all', label: '전체' }, { value: 'seating', label: '체어' }, { value: 'tables', label: '테이블' }, { value: 'lighting', label: '조명' }] }))
  );
</script>
</body>
</html>
