<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>preview</title></head>
<body style="margin:0;background:var(--canvas);padding:24px">
<div id="root"></div>
<script>
  var K = window.KOREX, h = React.createElement;
  var col = function (gap) { return { style: { display: 'flex', flexDirection: 'column', gap: gap || 24 } }; };
  var row = function (gap) { return { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: gap || 24 } }; };
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', col(16),
      h('div', row(16),
        h(K.CTA, null, '컬렉션 살펴보기 ↗'),
        h(K.CTA, { state: 'hover' }, 'Primary · Hover'),
        h(K.CTA, { state: 'focus' }, 'Primary · Focus')),
      h('div', row(16),
        h(K.CTA, { variant: 'secondary' }, '초기화'),
        h(K.CTA, { variant: 'secondary', state: 'hover' }, 'Secondary · Hover'),
        h(K.CTA, { variant: 'secondary', state: 'focus' }, 'Secondary · Focus')))
  );
</script>
</body>
</html>
