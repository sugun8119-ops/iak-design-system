<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>preview</title></head>
<body style="margin:0;background:var(--canvas);padding:24px">
<div id="root"></div>
<script>
  var K = window.KOREX, h = React.createElement;
  var col = function (gap) { return { style: { display: 'flex', flexDirection: 'column', gap: gap || 24 } }; };
  var row = function (gap) { return { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: gap || 24 } }; };
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', col(24),
      h(K.ContentGrid, null,
        h(K.ProductCard, { title: '모듈 체어', category: 'SEATING / 우드' }),
        h(K.ProductCard, { title: '라운드 테이블', category: 'TABLES / 스톤', media: 'mint' }),
        h(K.ProductCard, { title: '소프트 램프', category: 'LIGHTING / 패브릭', media: 'light' })),
      h(K.ContentGrid, { empty: true, emptyTitle: '일치하는 제품이 없습니다.', emptyText: '다른 이름이나 소재를 입력하거나 필터를 초기화해 주세요.' }))
  );
</script>
</body>
</html>
