<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>preview</title></head>
<body style="margin:0;background:var(--canvas);padding:24px">
<div id="root"></div>
<script>
  var K = window.KOREX, h = React.createElement;
  var col = function (gap) { return { style: { display: 'flex', flexDirection: 'column', gap: gap || 24 } }; };
  var row = function (gap) { return { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: gap || 24 } }; };
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0,1fr))', gap: 24 } },
      h(K.ProductCard, { title: '모듈 체어', category: 'SEATING / 우드' }),
      h(K.ProductCard, { title: '라운드 테이블 (Hover)', category: 'TABLES / 스톤', media: 'mint', state: 'hover' }),
      h(K.ProductCard, { title: '소프트 램프 (Focus)', category: 'LIGHTING / 패브릭', media: 'light', state: 'focus' }))
  );
</script>
</body>
</html>
