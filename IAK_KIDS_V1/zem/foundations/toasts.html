<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IAK KIDS_V1 · Toasts overview</title><link rel="stylesheet" href="../../styles.css"><script src="../lib/icons.js"></script><style></style></head><body><main class="mc"><header class="mc-head"><div class="ov">IAK KIDS_V1 · Overview</div><h1>Toasts overview</h1><p>알림 4 tone. 상세는 Toast 카드.</p></header><ol style="list-style:none;margin:0;padding:0;display:grid;gap:10px;max-width:360px"><li class="zem-toast zem-toast--success"><span class="zem-toast-icon" data-ic="eva:checkmark-circle-2-fill"></span><div class="zem-toast-content"><div class="zem-toast-title">미션을 완료했어요</div><div class="zem-toast-description">보상이 지급되었습니다.</div></div><button class="zem-toast-close" aria-label="닫기" data-ic="eva:close-fill" data-s="18"></button></li><li class="zem-toast zem-toast--warning"><span class="zem-toast-icon" data-ic="eva:alert-triangle-fill"></span><div class="zem-toast-content"><div class="zem-toast-title">학원 시간이 10분 남았어요</div></div><button class="zem-toast-close" aria-label="닫기" data-ic="eva:close-fill" data-s="18"></button></li><li class="zem-toast zem-toast--error"><span class="zem-toast-icon" data-ic="eva:alert-circle-outline"></span><div class="zem-toast-content"><div class="zem-toast-title">메시지를 보내지 못했어요</div><div class="zem-toast-description">네트워크를 확인해 주세요.</div></div><button class="zem-toast-close" aria-label="닫기" data-ic="eva:close-fill" data-s="18"></button></li><li class="zem-toast zem-toast--info"><span class="zem-toast-icon" data-ic="eva:info-fill"></span><div class="zem-toast-content"><div class="zem-toast-title">새 일정이 추가되었어요</div></div><button class="zem-toast-close" aria-label="닫기" data-ic="eva:close-fill" data-s="18"></button></li></ol></main><script>const G=(n,s)=>ZEM_ICONS[n]?'<svg width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+ZEM_ICONS[n].body+'</svg>':'';document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=G(e.dataset.ic,+e.dataset.s||20)+e.innerHTML);</script></body></html>
