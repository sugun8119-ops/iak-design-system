<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IAK KIDS_V1 · Motion</title><link rel="stylesheet" href="../../styles.css"></head><body><main class="mc"><style>.mv{width:48px;height:48px;border-radius:14px;background:var(--iak-kids-primary-default);transition-property:transform;transition-timing-function:var(--zem-ease)}.lane:hover .mv,.lane:focus-within .mv{transform:translateX(320px)}.lane{padding:16px;border-radius:var(--zem-radius-card);background:var(--zem-surface);box-shadow:var(--zem-shadow-card);display:flex;flex-direction:column;gap:10px}</style><header class="mc-head"><div class="ov">IAK KIDS_V1 · Foundations</div><h1>Motion</h1><p>짧고 부드럽게. 값은 파생이며 prefers-reduced-motion에서 1ms로 줄어듭니다. 레인에 마우스를 올리면 실제 토큰으로 움직입니다.</p></header><div class="stack"><div class="lane" tabindex="0"><div class="row between cap"><code>--zem-motion-fast</code><span>120ms · hover · 색 · 버튼 눌림</span></div><div class="mv" style="transition-duration:var(--zem-motion-fast)"></div></div><div class="lane" tabindex="0"><div class="row between cap"><code>--zem-motion-base</code><span>180ms · 입력 focus · 메뉴 · 토스트 진입</span></div><div class="mv" style="transition-duration:var(--zem-motion-base)"></div></div><div class="lane" tabindex="0"><div class="row between cap"><code>--zem-motion-slow</code><span>240ms · Dialog · progress 폭</span></div><div class="mv" style="transition-duration:var(--zem-motion-slow)"></div></div></div></main></body></html>
