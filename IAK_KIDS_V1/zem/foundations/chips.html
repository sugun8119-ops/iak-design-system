<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IAK KIDS_V1 · Chips & status</title><link rel="stylesheet" href="../../styles.css"><script src="../lib/icons.js"></script><style></style></head><body><main class="mc"><header class="mc-head"><div class="ov">IAK KIDS_V1 · Overview</div><h1>Chips & status</h1><p>상태 표현 요소. 색과 텍스트/아이콘을 함께 사용합니다.</p></header><div class="zem-card"><div class="row"><span class="zem-badge zem-badge--success">완료</span><span class="zem-badge zem-badge--info">진행 중</span><span class="zem-badge zem-badge--warning">곧 마감</span><span class="zem-badge zem-badge--error">다시 해봐요</span><span class="zem-badge">예정</span><span class="zem-badge zem-badge--accent">새 발견</span></div><div class="row"><span class="done" data-ic="eva:checkmark-fill" data-s="16"></span><span class="done lime" data-ic="solar:target-bold" data-s="16"></span><span class="done todo" data-ic="eva:arrow-ios-forward-fill" data-s="16"></span><div style="background:var(--iak-kids-background-canvas);padding:10px;border-radius:16px"><span class="zs-chip"><i>민</i>민서</span></div></div></div></main><script>const G=(n,s)=>ZEM_ICONS[n]?'<svg width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+ZEM_ICONS[n].body+'</svg>':'';document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=G(e.dataset.ic,+e.dataset.s||20)+e.innerHTML);</script></body></html>
