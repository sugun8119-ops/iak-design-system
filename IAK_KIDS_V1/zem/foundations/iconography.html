<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IAK KIDS_V1 · Iconography</title><link rel="stylesheet" href="../../styles.css"><script src="../lib/icons.js"></script><style></style></head><body><main class="mc"><header class="mc-head"><div class="ov">IAK KIDS_V1 · Brand</div><h1>Iconography</h1><p>캐릭터·일러스트·외부 브랜드 아이콘은 쓰지 않습니다. 일반 기능 아이콘(Eva/Solar 오픈소스)을 연한 역할색 타일 위에 짙은 잉크로 사용. 탭바 24px, 목록 20px, 버튼 18px.</p></header><div class="zem-card"><h2>목록 행 패턴</h2><ul class="rows" id="rows"></ul></div><div class="mc-note"><b>금지</b> · 캐릭터/마스코트 · 외부 로고/워드마크 · 게임·서비스 일러스트 트레이싱 · 사진.</div></main><script>const G=(n,s)=>'<svg width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+ZEM_ICONS[n].body+'</svg>';document.getElementById('rows').innerHTML=[['cyan','eva:calendar-fill','영어 학원','오후 4:00 – 5:00','done'],['violet','solar:book-bold','독서 20분','오늘 저녁까지','todo'],['peri','solar:target-bold','줄넘기 100번','주간 미션 · 3/5','lime']].map(([c,n,t,s,d])=>'<li><span class="tile '+c+'">'+G(n)+'</span><div class="t"><b>'+t+'</b><span>'+s+'</span></div><span class="done '+(d==='done'?'':d)+'">'+G(d==='done'?'eva:checkmark-fill':'eva:arrow-ios-forward-fill',16)+'</span></li>').join('')</script></body></html>
