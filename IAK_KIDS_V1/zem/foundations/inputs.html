<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IAK KIDS_V1 · Inputs overview</title><link rel="stylesheet" href="../../styles.css"><script src="../lib/icons.js"></script><style></style></head><body><main class="mc"><header class="mc-head"><div class="ov">IAK KIDS_V1 · Overview</div><h1>Inputs overview</h1><p>입력 컨트롤 요약. 상세는 TextField / Textarea / Select.</p></header><div class="mc-grid"><div class="mc-case"><div class="zem-field"><label>default</label><input class="zem-input" value="" placeholder="예: 영어 단어 20개"   ></div></div><div class="mc-case"><div class="zem-field"><label>filled</label><input class="zem-input" value="주말 줄넘기 챌린지" placeholder=""   ></div></div><div class="mc-case"><div class="zem-field"><label>focus</label><input class="zem-input" value="주말 줄넘기" placeholder="" data-preview-state="focus"  ></div></div><div class="mc-case"><div class="zem-field"><label>error</label><input class="zem-input" value="!!" placeholder=""  aria-invalid="true" ><p class="zem-help zem-error">특수문자는 사용할 수 없어요.</p></div></div><div class="mc-case"><div class="zem-field"><label>disabled</label><input class="zem-input" value="잠긴 미션" placeholder=""   disabled></div></div></div></main><script>const G=(n,s)=>ZEM_ICONS[n]?'<svg width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+ZEM_ICONS[n].body+'</svg>':'';document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=G(e.dataset.ic,+e.dataset.s||20)+e.innerHTML);</script></body></html>
