<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IAK KIDS_V1 · Borders</title><link rel="stylesheet" href="../../styles.css"></head><body><main class="mc"><header class="mc-head"><div class="ov">IAK KIDS_V1 · Spacing</div><h1>Borders</h1><p>border-subtle(장식)은 카드·구분선, border-default(3:1 이상)는 입력·체크박스·스위치 트랙 등 필수 경계, focus는 accent 3px 링 + 흰 틈.</p></header><div class="row" style="gap:16px"><figure style="margin:0;display:flex;flex-direction:column;gap:6px;font:var(--zem-text-caption);width:200px"><i style="display:block;height:64px;border-radius:var(--zem-radius-control);background:var(--zem-surface);border:1px solid var(--zem-border)"></i><b>1px solid</b><code>--iak-kids-border-subtle</code><span class="muted">구분선 · 표 행</span></figure><figure style="margin:0;display:flex;flex-direction:column;gap:6px;font:var(--zem-text-caption);width:200px"><i style="display:block;height:64px;border-radius:var(--zem-radius-control);background:var(--zem-surface);border:1.5px solid var(--iak-kids-border-default)"></i><b>1.5px solid</b><code>--iak-kids-border-default</code><span class="muted">입력 · 체크박스 (필수 경계)</span></figure><figure style="margin:0;display:flex;flex-direction:column;gap:6px;font:var(--zem-text-caption);width:200px"><i style="display:block;height:64px;border-radius:var(--zem-radius-control);background:var(--zem-surface);border:1.5px solid var(--iak-kids-border-strong)"></i><b>1.5px solid</b><code>--iak-kids-border-strong</code><span class="muted">입력 hover</span></figure><figure style="margin:0;display:flex;flex-direction:column;gap:6px;font:var(--zem-text-caption);width:200px"><i style="display:block;height:64px;border-radius:var(--zem-radius-control);background:var(--zem-surface);border:2px dashed var(--iak-kids-border-default)"></i><b>2px dashed</b><code>--iak-kids-border-default</code><span class="muted">드롭 영역</span></figure><figure style="margin:0;display:flex;flex-direction:column;gap:6px;font:var(--zem-text-caption);width:200px"><i style="display:block;height:64px;border-radius:var(--zem-radius-control);background:var(--zem-surface);border:3px solid var(--zem-focus-color);outline:2px solid var(--iak-kids-state-focus-gap);outline-offset:-5px"></i><b>3px solid + 흰 틈</b><code>--zem-focus-color</code><span class="muted">focus ring (accent)</span></figure></div></main></body></html>
