<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="부모 대시보드 · Parent dashboard" description="자녀별 사용 목표 카드 + 자녀 요청 수락/거절. 상태: default · empty · loading · error. 데이터는 로직의 static DATA에서 수정." -->
<helmet><script src="./ds-base.js"></script></helmet>
<div class="zs">
<nav class="zs-rail" aria-label="주 메뉴"><div class="wm">Little Everyday</div><a href="#" aria-current="page"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:home-fill" size="{{ 22 }}" hint-size="22px,22px"></x-import><span>홈</span></a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="solar:chart-2-bold" size="{{ 22 }}" hint-size="22px,22px"></x-import><span>리포트</span></a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="solar:checklist-bold" size="{{ 22 }}" hint-size="22px,22px"></x-import><span>미션</span></a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:calendar-fill" size="{{ 22 }}" hint-size="22px,22px"></x-import><span>일정</span></a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="solar:settings-bold" size="{{ 22 }}" hint-size="22px,22px"></x-import><span>설정</span></a></nav>
<div class="zs-main">
<header class="zs-header"><div class="zs-top"><span class="zs-ib" aria-hidden="true"></span><div class="grow">부모 홈</div><button type="button" class="zs-ib" aria-label="알림 2개"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="solar:bell-bold" size="{{ 22 }}" hint-size="22px,22px"></x-import><span class="zs-dot"></span></button></div>
<div class="zs-hero"><span class="zs-chip"><i>민</i>민서 · 도윤</span><h1>{{ hero }}</h1><p>{{ sub }}</p></div></header>
<main class="zs-body" data-state="{{ state }}">
<sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}"><div class="banner" role="alert"><span class="ic"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:alert-circle-outline" hint-size="24px,24px"></x-import></span><div class="stack" style="gap:6px;flex:1"><b>자녀 기기 정보를 불러오지 못했어요</b><span class="muted">도윤의 휴대폰이 오프라인이에요. 마지막 동기화 오후 2:48.</span><div><x-import component-from-global-scope="RAISDesignSystem_019e07.Button" variant="secondary" size="sm" on-click="{{ retry }}" hint-size="110px,36px">다시 시도</x-import></div></div></div></sc-if>
<sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}"><div class="zs-grid" aria-busy="true" aria-label="부모 홈을 불러오는 중"><div class="t4 d6"><x-import component-from-global-scope="RAISDesignSystem_019e07.Card" hint-size="100%,140px"><x-import component-from-global-scope="RAISDesignSystem_019e07.Skeleton" height="{{ 16 }}" width="45%" hint-size="45%,16px"></x-import><x-import component-from-global-scope="RAISDesignSystem_019e07.Skeleton" height="{{ 28 }}" width="70%" hint-size="70%,28px"></x-import></x-import></div><div class="t4 d6"><x-import component-from-global-scope="RAISDesignSystem_019e07.Card" hint-size="100%,140px"><x-import component-from-global-scope="RAISDesignSystem_019e07.Skeleton" height="{{ 16 }}" width="45%" hint-size="45%,16px"></x-import><x-import component-from-global-scope="RAISDesignSystem_019e07.Skeleton" height="{{ 28 }}" width="70%" hint-size="70%,28px"></x-import></x-import></div><div class="t8 d12"><x-import component-from-global-scope="RAISDesignSystem_019e07.Card" hint-size="100%,220px"><x-import component-from-global-scope="RAISDesignSystem_019e07.Skeleton" height="{{ 140 }}" hint-size="100%,140px"></x-import></x-import></div></div></sc-if>
<sc-if value="{{ isReady }}" hint-placeholder-val="{{ true }}"><div class="zs-grid">
<sc-for list="{{ kids }}" as="k" hint-placeholder-count="2"><div class="t4 d6"><x-import component-from-global-scope="RAISDesignSystem_019e07.Card" hint-size="100%,140px"><div class="row between"><div class="row"><span class="ava">{{ k.initial }}</span><b>{{ k.name }}</b></div><x-import component-from-global-scope="RAISDesignSystem_019e07.Badge" tone="{{ k.tone }}" hint-size="72px,24px">{{ k.badge }}</x-import></div><div class="kpi">{{ k.usage }}</div><div class="prog" role="progressbar" aria-valuenow="{{ k.pct }}" aria-valuemin="0" aria-valuemax="100" aria-label="{{ k.aria }}"><i style="width:{{ k.width }}"></i></div><span class="muted cap">{{ k.goalText }}</span></x-import></div></sc-for>
<div class="t8 d12"><x-import component-from-global-scope="RAISDesignSystem_019e07.Card" title="자녀 요청" hint-size="100%,260px">
<sc-if value="{{ hasRequests }}" hint-placeholder-val="{{ true }}"><ul class="rows"><sc-for list="{{ requests }}" as="r" hint-placeholder-count="3"><li><span class="tile {{ r.tile }}"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="solar:chat-round-line-bold" size="{{ 20 }}" hint-size="20px,20px"></x-import></span><div class="t"><b>{{ r.what }}</b><span>{{ r.meta }}</span></div><div class="row" style="flex-wrap:nowrap"><x-import component-from-global-scope="RAISDesignSystem_019e07.Button" size="sm" variant="secondary" on-click="{{ r.reject }}" hint-size="56px,36px">거절</x-import><x-import component-from-global-scope="RAISDesignSystem_019e07.Button" size="sm" on-click="{{ r.accept }}" hint-size="56px,36px">수락</x-import></div></li></sc-for></ul></sc-if>
<sc-if value="{{ noRequests }}" hint-placeholder-val="{{ false }}"><div class="empty"><div class="plate"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:checkmark-circle-2-fill" size="{{ 32 }}" hint-size="32px,32px"></x-import></div><h2>새 요청이 없어요</h2><p>아이가 요청을 보내면 이곳에 바로 보여요.</p></div></sc-if>
</x-import></div>
</div></sc-if>
</main></div>
<nav class="zs-tabbar" aria-label="하단 탭"><a href="#" aria-current="page"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:home-fill" size="{{ 24 }}" hint-size="24px,24px"></x-import>홈</a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:calendar-fill" size="{{ 24 }}" hint-size="24px,24px"></x-import>일정</a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="solar:checklist-bold" size="{{ 24 }}" hint-size="24px,24px"></x-import>미션</a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:more-horizontal-fill" size="{{ 24 }}" hint-size="24px,24px"></x-import>더보기</a></nav>
<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}"><ol class="zem-toast-viewport"><x-import component-from-global-scope="RAISDesignSystem_019e07.Toast" tone="{{ toast.tone }}" title="{{ toast.title }}" description="{{ toast.description }}" on-close="{{ closeToast }}" hint-size="320px,64px"></x-import></ol></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;empty&quot;,&quot;loading&quot;,&quot;error&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;'default'|'empty'|'loading'|'error'&quot;,&quot;section&quot;:&quot;상태&quot;}}">
class Component extends DCLogic {
  // ▼ 수정할 데이터 — 자녀·사용 시간·요청. 실제 API 응답으로 교체하세요 (가상 예시).
  static DATA = {
    asOf: '오늘 오후 3:12 기준',
    kids: [
      { name: '민서', usedMin: 88, goalMin: 90, tile: 'cyan' },
      { name: '도윤', usedMin: 130, goalMin: 120, tile: 'violet' }
    ],
    requests: [
      { id: 1, kid: '민서', what: '게임 30분 더 하기', why: '숙제 다 했어요' },
      { id: 2, kid: '도윤', what: '영상 앱 사용', why: '학교 과제 영상 보기' },
      { id: 3, kid: '민서', what: '친구 집에서 저녁까지 놀기 — 오후 7시 전에 귀가할게요', why: null }
    ]
  };
  init(s) { return { requests: s === 'empty' ? [] : Component.DATA.requests.slice(), toast: null, phase: s || 'default' }; }
  state = this.init(this.props.state);
  componentDidUpdate(p) { if (p.state !== this.props.state) this.setState(this.init(this.props.state)); }
  componentWillUnmount() { clearTimeout(this.t); }
  fmt(m) { const h = Math.floor(m / 60), r = m % 60; return (h ? h + '시간 ' : '') + (r ? r + '분' : '').trim(); }
  notify(toast) { clearTimeout(this.t); this.setState({ toast }); this.t = setTimeout(() => this.setState({ toast: null }), 4000); }
  act(r, ok) {
    this.setState(s => ({ requests: s.requests.filter(x => x.id !== r.id) }));
    this.notify({ tone: ok ? 'success' : 'info', title: ok ? r.kid + '의 요청을 수락했어요' : '요청을 거절했어요', description: r.what });
  }
  renderVals() {
    const { requests, toast, phase } = this.state, D = Component.DATA;
    const isLoading = phase === 'loading', isError = phase === 'error';
    return {
      state: phase, isLoading, isError, isReady: !isLoading,
      hero: isLoading ? '불러오는 중…' : requests.length ? '확인할 요청 ' + requests.length + '개' : '모든 요청을 확인했어요',
      sub: D.asOf,
      kids: D.kids.map(k => {
        const pct = Math.min(100, Math.round(k.usedMin / k.goalMin * 100)), over = k.usedMin > k.goalMin;
        return { name: k.name, initial: k.name[0], usage: isError && over ? '—' : this.fmt(k.usedMin), pct, width: pct + '%', tone: over ? 'warning' : 'success', badge: over ? '목표 초과' : '목표 이내', aria: k.name + ' 사용 목표 대비', goalText: '하루 목표 ' + this.fmt(k.goalMin) };
      }),
      hasRequests: requests.length > 0, noRequests: requests.length === 0,
      requests: requests.map(r => ({ what: r.what, meta: r.kid + ' · ' + (r.why || '사유 없음'), tile: (D.kids.find(k => k.name === r.kid) || {}).tile || 'soft', accept: () => this.act(r, true), reject: () => this.act(r, false) })),
      retry: () => this.setState({ phase: 'default' }),
      toast, closeToast: () => this.setState({ toast: null })
    };
  }
}
</script>
</body>
</html>
