<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="주간 일정 · Weekly schedule" description="v2.3 · 모바일: 요일 선택 + 하루 타임라인 / 태블릿·데스크톱: 주간 시간표 + 오늘 타임라인. 일정 추가 Dialog(검증·첫 오류 초점). 상태: default · empty · loading · error · dialog · validation-error · long-text. 데이터는 로직의 static DATA에서 수정." -->
<helmet><script src="./ds-base.js"></script></helmet>
<div class="zs">
<nav class="zs-rail" aria-label="주 메뉴"><div class="wm">Little Everyday</div><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:home-fill" size="{{ 22 }}" hint-size="22px,22px"></x-import><span>홈</span></a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="solar:chart-2-bold" size="{{ 22 }}" hint-size="22px,22px"></x-import><span>리포트</span></a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="solar:checklist-bold" size="{{ 22 }}" hint-size="22px,22px"></x-import><span>미션</span></a><a href="#" aria-current="page"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:calendar-fill" size="{{ 22 }}" hint-size="22px,22px"></x-import><span>일정</span></a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="solar:settings-bold" size="{{ 22 }}" hint-size="22px,22px"></x-import><span>설정</span></a></nav>
<div class="zs-main">
<header class="zs-header"><div class="zs-top"><span class="zs-ib" aria-hidden="true"></span><div class="grow">일정</div><button type="button" class="zs-ib" aria-label="알림 2개"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="solar:bell-bold" size="{{ 22 }}" hint-size="22px,22px"></x-import><span class="zs-dot"></span></button></div>
<div class="zs-hero"><span class="zs-chip"><i>민</i>민서 · 초등 3학년</span><h1>이번 주 시간표</h1><p>{{ sub }}</p></div></header>
<main class="zs-body" data-state="{{ state }}">
<sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}"><div class="banner" role="alert"><span class="ic"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:alert-circle-outline" hint-size="24px,24px"></x-import></span><div class="stack" style="gap:6px;flex:1"><b>이번 주 일정을 불러오지 못했어요</b><span class="muted">연결을 확인한 뒤 다시 시도해 주세요. 이미 추가한 일정은 이 화면에 남아 있어요.</span><div><x-import component-from-global-scope="RAISDesignSystem_019e07.Button" variant="secondary" size="sm" on-click="{{ retry }}" hint-size="110px,36px">다시 시도</x-import></div></div></div></sc-if>
<div class="zp-mobile-only">
<div class="zp-days" role="radiogroup" aria-label="요일 선택"><sc-for list="{{ dayBtns }}" as="d" hint-placeholder-count="5"><button type="button" class="zp-day" role="radio" id="{{ d.id }}" aria-checked="{{ d.sel }}" aria-label="{{ d.aria }}" tabIndex="{{ d.tab }}" onClick="{{ d.pick }}" onKeyDown="{{ d.key }}"><span>{{ d.label }}</span><small>{{ d.sub }}</small></button></sc-for></div>
<x-import component-from-global-scope="RAISDesignSystem_019e07.Card" title="{{ dayTitle }}" hint-size="100%,240px"><x-import component-from-global-scope="RAISDesignSystem_019e07.DailyTimeline" items="{{ dayItems }}" state="{{ tlState }}" on-retry="{{ retry }}" label="{{ dayTitle }}" empty-title="이날은 일정이 없어요" empty-text="아래 ‘일정 추가’로 학원·숙제·놀이 시간을 넣어 보세요." hint-size="100%,200px"></x-import></x-import>
<x-import component-from-global-scope="RAISDesignSystem_019e07.Button" size="lg" on-click="{{ openDialog }}" style="width:100%" hint-size="100%,56px"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:plus-fill" size="{{ 18 }}" hint-size="18px,18px"></x-import>일정 추가</x-import>
</div>
<div class="zp-wide-only"><div class="zp-split">
<x-import component-from-global-scope="RAISDesignSystem_019e07.Card" title="주간 시간표" hint-size="100%,320px">
<sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}"><div aria-busy="true" aria-label="주간 시간표를 불러오는 중"><x-import component-from-global-scope="RAISDesignSystem_019e07.Skeleton" height="{{ 180 }}" hint-size="100%,180px"></x-import></div></sc-if>
<sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}"><div class="tt" role="table" aria-label="주간 시간표"><div class="h"></div><sc-for list="{{ days }}" as="d" hint-placeholder-count="5"><div class="h">{{ d.label }}</div></sc-for><sc-for list="{{ grid }}" as="row" hint-placeholder-count="3"><div class="h" style="align-self:center">{{ row.slot }}</div><sc-for list="{{ row.cells }}" as="c" hint-placeholder-count="5"><div style="background:{{ c.bg }};font-weight:700;overflow-wrap:anywhere">{{ c.text }}</div></sc-for></sc-for></div></sc-if>
<sc-if value="{{ noItems }}" hint-placeholder-val="{{ false }}"><div class="empty" style="box-shadow:none"><div class="plate"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:calendar-fill" size="{{ 32 }}" hint-size="32px,32px"></x-import></div><h2>이번 주 일정이 비어 있어요</h2><p>학원·숙제·놀이 시간을 추가하면 시간표에 바로 보여요.</p></div></sc-if>
<div class="legend"><sc-for list="{{ legend }}" as="l" hint-placeholder-count="4"><span><i style="background:{{ l.color }}"></i>{{ l.label }}</span></sc-for></div>
<div class="row" style="justify-content:flex-end"><x-import component-from-global-scope="RAISDesignSystem_019e07.Button" on-click="{{ openDialog }}" hint-size="120px,44px"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:plus-fill" size="{{ 18 }}" hint-size="18px,18px"></x-import>일정 추가</x-import></div>
</x-import>
<x-import component-from-global-scope="RAISDesignSystem_019e07.Card" title="{{ todayTitle }}" hint-size="100%,240px"><x-import component-from-global-scope="RAISDesignSystem_019e07.DailyTimeline" items="{{ todayItems }}" state="{{ tlState }}" on-retry="{{ retry }}" label="오늘 일정" empty-text="오늘은 일정이 없어요." hint-size="100%,200px"></x-import></x-import>
</div></div>
</main></div>
<nav class="zs-tabbar" aria-label="하단 탭"><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:home-fill" size="{{ 24 }}" hint-size="24px,24px"></x-import>홈</a><a href="#" aria-current="page"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:calendar-fill" size="{{ 24 }}" hint-size="24px,24px"></x-import>일정</a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="solar:checklist-bold" size="{{ 24 }}" hint-size="24px,24px"></x-import>미션</a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:more-horizontal-fill" size="{{ 24 }}" hint-size="24px,24px"></x-import>더보기</a></nav>
<x-import component-from-global-scope="RAISDesignSystem_019e07.Dialog" open="{{ open }}" on-open-change="{{ setOpen }}" title="일정 추가" description="요일과 시간을 고르면 시간표에 바로 들어가요. (데모: 이 화면 메모리에만 저장)" hint-size="0px,0px"><div class="stack">
<x-import component-from-global-scope="RAISDesignSystem_019e07.TextField" id="ws-name" label="일정 이름" required="{{ true }}" value="{{ name }}" on-change="{{ onName }}" error="{{ err }}" description="{{ nameHelp }}" placeholder="예: 미술 학원" hint-size="100%,72px"></x-import>
<!-- option 목록은 DATA.days / slots / kinds 순서와 같게 유지하세요 (value = 인덱스 / 종류 이름) -->
<div class="row" style="flex-wrap:nowrap"><div style="flex:1;min-width:0"><x-import component-from-global-scope="RAISDesignSystem_019e07.Select" label="요일" value="{{ form.d }}" on-change="{{ onDay }}" hint-size="100%,72px"><option value="0">월</option><option value="1">화</option><option value="2">수</option><option value="3">목</option><option value="4">금</option></x-import></div><div style="flex:1;min-width:0"><x-import component-from-global-scope="RAISDesignSystem_019e07.Select" label="시간" value="{{ form.s }}" on-change="{{ onSlot }}" hint-size="100%,72px"><option value="0">1시</option><option value="1">3시</option><option value="2">5시</option></x-import></div></div>
<x-import component-from-global-scope="RAISDesignSystem_019e07.Select" label="종류" value="{{ form.k }}" on-change="{{ onKind }}" hint-size="100%,72px"><option value="학원">학원</option><option value="숙제">숙제</option><option value="놀이">놀이</option><option value="운동">운동</option></x-import>
<div class="row" style="justify-content:flex-end"><x-import component-from-global-scope="RAISDesignSystem_019e07.Button" variant="secondary" on-click="{{ closeDialog }}" hint-size="72px,44px">취소</x-import><x-import component-from-global-scope="RAISDesignSystem_019e07.Button" on-click="{{ save }}" hint-size="72px,44px">추가</x-import></div>
</div></x-import>
<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}"><ol class="zem-toast-viewport"><x-import component-from-global-scope="RAISDesignSystem_019e07.Toast" tone="{{ toast.tone }}" title="{{ toast.title }}" description="{{ toast.description }}" on-close="{{ closeToast }}" hint-size="320px,64px"></x-import></ol></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;empty&quot;,&quot;loading&quot;,&quot;error&quot;,&quot;dialog&quot;,&quot;validation-error&quot;,&quot;long-text&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;'default'|'empty'|'loading'|'error'|'dialog'|'validation-error'|'long-text'&quot;,&quot;section&quot;:&quot;상태&quot;}}">
class Component extends DCLogic {
  // ▼ 수정할 데이터 — 요일·시간 슬롯(표시 시각)·지금 슬롯·일정 종류(색 토큰)·일정(dur = 분, 선택). 오늘 = todayIndex.
  // 일정 추가는 메모리 기반 데모입니다 (서버 저장 없음).
  static DATA = {
    week: '9월 넷째 주', todayIndex: 2, nowSlot: 1,
    days: ['월', '화', '수', '목', '금'], dates: ['22일', '23일', '24일', '25일', '26일'],
    slots: ['1시', '3시', '5시'], slotTimes: ['13:00', '15:00', '17:00'],
    kinds: { 학원: ['var(--zem-cyan-100)', 'cyan'], 숙제: ['var(--zem-lime-100)', 'lime'], 놀이: ['var(--zem-mint-100)', 'mint'], 운동: ['var(--zem-violet-100)', 'violet'] },
    items: [
      { d: 0, s: 0, t: '수학 학원', k: '학원', dur: 60 }, { d: 1, s: 1, t: '줄넘기', k: '운동', dur: 30 }, { d: 2, s: 0, t: '영어 학원', k: '학원', dur: 60 },
      { d: 2, s: 2, t: '독서 20분', k: '숙제', dur: 20 }, { d: 3, s: 1, t: '놀이터', k: '놀이', dur: 60 }, { d: 4, s: 2, t: '피아노', k: '학원', dur: 50 }
    ]
  };
  static LONG = [{ d: 2, s: 1, t: '할머니 댁에 가서 저녁 먹고 오늘 배운 노래를 불러 드리기', k: '놀이', dur: 90 }, { d: 2, s: 2, t: '내일 가져갈 준비물을 알림장 보고 가방에 모두 넣기', k: '숙제', dur: 15 }];
  phaseOf(p) { return p || new URLSearchParams(location.search).get('state') || 'default'; }
  init(p) {
    const s = this.phaseOf(p), D = Component.DATA;
    let items = s === 'empty' || s === 'loading' ? [] : D.items.slice();
    if (s === 'long-text') items = [...items.filter(i => i.d !== 2), ...Component.LONG, { d: 2, s: 0, t: '영어 학원', k: '학원', dur: 60 }];
    return { phase: s, items, day: D.todayIndex, open: s === 'dialog' || s === 'validation-error', name: '', err: s === 'validation-error' ? '일정 이름을 입력해 주세요.' : '', form: { d: String(D.todayIndex), s: '1', k: '숙제' }, toast: null };
  }
  state = this.init(this.props.state);
  componentDidUpdate(p) { if (p.state !== this.props.state) this.setState(this.init(this.props.state)); }
  componentWillUnmount() { clearTimeout(this.t); }
  save() {
    const n = this.state.name.trim();
    if (!n) { this.setState({ err: '일정 이름을 입력해 주세요.' }); return setTimeout(() => { const el = document.getElementById('ws-name'); el && el.focus(); }, 0); }
    if (n.length > 40) { this.setState({ err: '일정 이름은 40자 이내로 줄여 주세요. (지금 ' + n.length + '자)' }); return setTimeout(() => { const el = document.getElementById('ws-name'); el && el.focus(); }, 0); }
    const f = this.state.form;
    this.setState(s => ({ items: [...s.items, { d: +f.d, s: +f.s, t: n, k: f.k, dur: 60 }], day: +f.d, open: false, name: '', err: '', toast: { tone: 'success', title: '일정을 추가했어요 (데모)', description: n + ' — 이 화면 메모리에만 있어요' } }));
    clearTimeout(this.t); this.t = setTimeout(() => this.setState({ toast: null }), 4000);
  }
  status(d, s) { const D = Component.DATA; if (d < D.todayIndex) return 'done'; if (d > D.todayIndex) return 'upcoming'; return s < D.nowSlot ? 'done' : s === D.nowSlot ? 'current' : 'upcoming'; }
  timeline(d) { const D = Component.DATA; return this.state.items.filter(i => i.d === d).sort((a, b) => a.s - b.s).map((i, x) => ({ id: d + '-' + i.s + '-' + x, time: D.slotTimes[i.s], title: i.t, duration: i.dur, note: i.k, status: this.status(d, i.s) })); }
  moveDay(e, i) {
    const n = Component.DATA.days.length; let t = null;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') t = (i + 1) % n; else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') t = (i - 1 + n) % n; else if (e.key === 'Home') t = 0; else if (e.key === 'End') t = n - 1;
    if (t === null) return; e.preventDefault(); this.setState({ day: t }); setTimeout(() => { const el = document.getElementById('ws-day-' + t); el && el.focus(); }, 0);
  }
  renderVals() {
    const D = Component.DATA, { items, form, phase, day } = this.state, isLoading = phase === 'loading', isError = phase === 'error';
    const cell = (d, s) => items.filter(i => i.d === d && i.s === s);
    const setF = k => e => this.setState({ form: { ...form, [k]: e.target.value } });
    const count = d => items.filter(i => i.d === d).length;
    return {
      state: phase, sub: isLoading ? '불러오는 중…' : items.length + '개 일정 · ' + D.week, isLoading, isError,
      hasItems: !isLoading && items.length > 0, noItems: !isLoading && items.length === 0,
      dayBtns: D.days.map((label, i) => ({ id: 'ws-day-' + i, label, sel: i === day, tab: i === day ? 0 : -1, sub: i === D.todayIndex ? '오늘' : count(i) + '개', aria: label + '요일 ' + D.dates[i] + (i === D.todayIndex ? ', 오늘' : '') + ', 일정 ' + count(i) + '개', pick: () => this.setState({ day: i }), key: e => this.moveDay(e, i) })),
      dayTitle: D.days[day] + '요일 ' + D.dates[day] + (day === D.todayIndex ? ' · 오늘' : ''), dayItems: this.timeline(day),
      todayTitle: '오늘 · ' + D.days[D.todayIndex] + '요일', todayItems: this.timeline(D.todayIndex),
      tlState: isLoading ? 'loading' : isError ? 'error' : 'ready',
      days: D.days.map((label, v) => ({ label, v: String(v) })),
      grid: D.slots.map((slot, si) => ({ slot, cells: D.days.map((_, di) => { const c = cell(di, si); return { text: c.map(i => i.t).join(' · '), bg: c.length ? D.kinds[c[0].k][0] : 'var(--iak-kids-background-canvas)' }; }) })),
      legend: Object.entries(D.kinds).map(([label, v]) => ({ label, color: v[0] })),
      open: this.state.open, name: this.state.name, err: this.state.err || undefined, nameHelp: this.state.err ? undefined : '40자 이내', form,
      setOpen: v => this.setState(v ? { open: true } : { open: false, err: '' }),
      openDialog: () => this.setState({ open: true, form: { ...form, d: String(day) } }), closeDialog: () => this.setState({ open: false, err: '' }),
      onName: e => this.setState({ name: e.target.value, err: '' }), onDay: setF('d'), onSlot: setF('s'), onKind: setF('k'),
      save: () => this.save(), retry: () => this.setState({ phase: 'default' }),
      toast: this.state.toast, closeToast: () => this.setState({ toast: null })
    };
  }
}
</script>
</body>
</html>
