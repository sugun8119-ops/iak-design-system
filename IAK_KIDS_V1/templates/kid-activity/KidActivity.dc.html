<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="아이 활동 · Kid activity" description="v2.3 · 지금 할 일(집중 타이머) → 오늘 순서(타임라인) → 미션 완료 피드백(진행률·포인트·되돌리기). 상태: default · all-done · empty · loading · error · long-text. 데이터는 로직의 static DATA에서 수정." -->
<helmet><script src="./ds-base.js"></script></helmet>
<div class="zs">
<nav class="zs-rail" aria-label="주 메뉴"><div class="wm">Little Everyday</div><a href="#" aria-current="page"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:home-fill" size="{{ 22 }}" hint-size="22px,22px"></x-import><span>홈</span></a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="solar:chart-2-bold" size="{{ 22 }}" hint-size="22px,22px"></x-import><span>기록</span></a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="solar:checklist-bold" size="{{ 22 }}" hint-size="22px,22px"></x-import><span>미션</span></a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:calendar-fill" size="{{ 22 }}" hint-size="22px,22px"></x-import><span>일정</span></a></nav>
<div class="zs-main">
<header class="zs-header"><div class="zs-top"><span class="zs-ib" aria-hidden="true"></span><div class="grow">오늘의 미션</div><button type="button" class="zs-ib" aria-label="알림 2개"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="solar:bell-bold" size="{{ 22 }}" hint-size="22px,22px"></x-import><span class="zs-dot"></span></button></div>
<div class="zs-hero"><span class="zs-chip"><i>민</i>민서 · 초등 3학년</span><h1>{{ hero }}</h1><p>{{ sub }}</p></div></header>
<main class="zs-body" data-state="{{ state }}">
<sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}"><div class="stack" aria-busy="true" aria-label="미션을 불러오는 중"><x-import component-from-global-scope="RAISDesignSystem_019e07.Card" hint-size="100%,100px"><x-import component-from-global-scope="RAISDesignSystem_019e07.Skeleton" height="{{ 16 }}" width="40%" hint-size="40%,16px"></x-import><x-import component-from-global-scope="RAISDesignSystem_019e07.Skeleton" height="{{ 12 }}" hint-size="100%,12px"></x-import></x-import><x-import component-from-global-scope="RAISDesignSystem_019e07.Card" hint-size="100%,220px"><x-import component-from-global-scope="RAISDesignSystem_019e07.Skeleton" height="{{ 160 }}" hint-size="100%,160px"></x-import></x-import></div></sc-if>
<sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="RAISDesignSystem_019e07.MissionFeedback" missions="{{ noMissions }}" state="error" on-retry="{{ retry }}" hint-size="100%,120px"></x-import></sc-if>
<sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}"><div class="empty"><div class="plate"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="solar:target-bold" size="{{ 32 }}" hint-size="32px,32px"></x-import></div><h2>오늘은 미션이 없어요</h2><p>보호자가 미션을 보내면 이곳에 바로 보여요.</p></div></sc-if>
<sc-if value="{{ hasMissions }}" hint-placeholder-val="{{ true }}"><div class="zp-cols2">
<div class="stack g16">
<x-import component-from-global-scope="RAISDesignSystem_019e07.Card" hint-size="100%,260px">
<sc-if value="{{ hasCurrent }}" hint-placeholder-val="{{ true }}"><x-import component-from-global-scope="RAISDesignSystem_019e07.FocusSession" title="{{ cur.title }}" duration-sec="{{ cur.sec }}" steps="{{ cur.steps }}" reset-key="{{ cur.key }}" label="지금 할 일" on-complete="{{ finishCurrent }}" hint-size="100%,240px"></x-import></sc-if>
<sc-if value="{{ allDone }}" hint-placeholder-val="{{ false }}"><div class="stack" style="align-items:flex-start"><span class="tile mint"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:checkmark-circle-2-fill" size="{{ 22 }}" hint-size="22px,22px"></x-import></span><b style="font:var(--zem-text-title)">오늘 할 일을 모두 끝냈어요</b><span class="muted">보호자가 확인하면 포인트가 확정돼요. 잘못 눌렀다면 아래 미션에서 ‘완료 취소’를 누르세요.</span></div></sc-if>
</x-import>
<x-import component-from-global-scope="RAISDesignSystem_019e07.Card" title="오늘 순서" hint-size="100%,240px"><x-import component-from-global-scope="RAISDesignSystem_019e07.DailyTimeline" items="{{ timeline }}" show-steps="none" label="오늘 순서" hint-size="100%,220px"></x-import></x-import>
</div>
<x-import component-from-global-scope="RAISDesignSystem_019e07.Card" hint-size="100%,320px"><x-import component-from-global-scope="RAISDesignSystem_019e07.MissionFeedback" missions="{{ missions }}" completed-ids="{{ doneIds }}" on-change="{{ onMissions }}" title="오늘의 미션" hint-size="100%,300px"></x-import></x-import>
</div></sc-if>
</main></div>
<nav class="zs-tabbar" aria-label="하단 탭"><a href="#" aria-current="page"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:home-fill" size="{{ 24 }}" hint-size="24px,24px"></x-import>홈</a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:calendar-fill" size="{{ 24 }}" hint-size="24px,24px"></x-import>일정</a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="solar:checklist-bold" size="{{ 24 }}" hint-size="24px,24px"></x-import>미션</a><a href="#"><x-import component-from-global-scope="RAISDesignSystem_019e07.Icon" name="eva:more-horizontal-fill" size="{{ 24 }}" hint-size="24px,24px"></x-import>더보기</a></nav>
<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}"><ol class="zem-toast-viewport"><x-import component-from-global-scope="RAISDesignSystem_019e07.Toast" tone="{{ toast.tone }}" title="{{ toast.title }}" description="{{ toast.description }}" on-close="{{ closeToast }}" hint-size="320px,64px"></x-import></ol></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;all-done&quot;,&quot;empty&quot;,&quot;loading&quot;,&quot;error&quot;,&quot;long-text&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;'default'|'all-done'|'empty'|'loading'|'error'|'long-text'&quot;,&quot;section&quot;:&quot;상태&quot;}}">
class Component extends DCLogic {
  // ▼ 수정할 데이터 — 오늘의 미션. pt:null = 포인트 미정. time/dur(분)/steps는 v2.3 추가(선택).
  // 완료 상태·포인트는 메모리 기반 데모입니다. 보호자 확인/서버 저장은 하지 않습니다.
  static DATA = {
    missions: [
      { id: 1, n: '줄넘기 100번', pt: 50, done: true, time: '14:00', dur: 10 },
      { id: 2, n: '영어 단어 20개 외우기', pt: 100, done: false, time: '15:00', dur: 20, steps: [{ title: '단어 10개 소리 내어 읽기', done: true }, { title: '나머지 10개 읽기' }, { title: '안 보고 5개 써 보기' }] },
      { id: 3, n: '방 정리하고 사진 보내기', pt: 50, done: false, time: '17:00', dur: 15, steps: [{ title: '책상 위 치우기' }, { title: '장난감 상자에 넣기' }, { title: '사진 찍어 보내기' }] },
      { id: 4, n: '가족에게 오늘 있었던 일 이야기하기', pt: null, done: false, time: '19:30', dur: 10 }
    ]
  };
  static LONG = [{ id: 11, n: '동생이랑 같이 레고 정리하고 상자마다 이름표를 붙여서 선반에 올려 두기', pt: 80, done: false, time: '16:00', dur: 25, steps: [{ title: '색깔별로 레고 조각을 나눠서 상자에 담기' }, { title: '이름표 스티커에 상자 이름 쓰기' }] }, { id: 12, n: '물 여섯 컵 마시기', pt: 20, done: true, time: '18:00', dur: 5 }];
  phaseOf(p) { return p || new URLSearchParams(location.search).get('state') || 'default'; }
  init(p) {
    const s = this.phaseOf(p), m = s === 'long-text' ? Component.LONG : Component.DATA.missions;
    return { phase: s, toast: null, m: s === 'empty' ? [] : s === 'all-done' ? m.map(x => ({ ...x, done: true })) : m.map(x => ({ ...x })) };
  }
  state = this.init(this.props.state);
  componentDidUpdate(p) { if (p.state !== this.props.state) this.setState(this.init(this.props.state)); }
  componentWillUnmount() { clearTimeout(this.t); }
  notify(toast) { clearTimeout(this.t); this.setState({ toast }); this.t = setTimeout(() => this.setState({ toast: null }), 4000); }
  finish(x) {
    if (!x || x.done) return; // 같은 미션 중복 보상 방지: 이미 완료면 무시
    this.setState(s => ({ m: s.m.map(y => y.id === x.id ? { ...y, done: true } : y) }));
    this.notify({ tone: 'success', title: '미션 완료! ' + (x.pt != null ? '+' + x.pt + 'P' : '포인트 미정'), description: x.n + ' — 보호자 확인을 기다려요 (데모)' });
  }
  renderVals() {
    const { m, phase } = this.state, loading = phase === 'loading', error = phase === 'error';
    const done = m.filter(x => x.done).length, pts = m.filter(x => x.done).reduce((a, x) => a + (x.pt || 0), 0);
    const cur = m.find(x => !x.done);
    return {
      state: phase, isLoading: loading, isError: error, isEmpty: !loading && !error && m.length === 0, hasMissions: !loading && !error && m.length > 0,
      hero: loading ? '불러오는 중…' : error ? '미션을 불러오지 못했어요' : !m.length ? '오늘은 쉬는 날!' : done === m.length ? '오늘 미션을 모두 끝냈어요' : m.length + '개 중 ' + done + '개 완료',
      sub: '오늘 모은 포인트 ' + pts + 'P',
      hasCurrent: !!cur, allDone: !cur && m.length > 0,
      cur: cur ? { title: cur.n, sec: (cur.dur || 10) * 60, steps: cur.steps || [], key: cur.id } : {},
      finishCurrent: () => this.finish(cur),
      timeline: m.map(x => ({ id: x.id, time: x.time, title: x.n, duration: x.dur, status: x.done ? 'done' : cur && x.id === cur.id ? 'current' : 'upcoming' })),
      missions: m.map(x => ({ id: x.id, title: x.n, points: x.pt })), doneIds: m.filter(x => x.done).map(x => x.id), noMissions: [],
      onMissions: c => this.setState(s => ({ m: s.m.map(y => ({ ...y, done: c.completedIds.indexOf(y.id) >= 0 })) })),
      retry: () => this.setState(this.init('default')),
      toast: this.state.toast, closeToast: () => this.setState({ toast: null })
    };
  }
}
</script>
</body>
</html>
