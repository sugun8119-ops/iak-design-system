<!-- @dsCard group="Type" viewport="700x400" name="KOSAF/Source styles (60)" subtitle="Preservation-only exact source combinations — do not use for new UI" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--kosaf-font);color:var(--kosaf-color-text-primary)}.m{font-size:12px;line-height:16px;color:var(--kosaf-color-text-muted)}.t{font-size:14px;line-height:20px;font-weight:500}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:5px;border:1px solid var(--kosaf-color-border-subtle)}code{font:11px/14px ui-monospace,Menlo,monospace;color:var(--kosaf-color-text-secondary)}</style><link rel="stylesheet" href="doc.css"></head><body><script src="source-styles.js"></script><div id="g" style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px 16px"></div><script>document.getElementById("g").innerHTML=window.KOSAF_SOURCE_STYLES.map(s=>`<div style="display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden"><code style="width:24px">${s.size}</code><code style="width:26px">${s.w}</code><code style="width:44px">${s.lh}</code><code>${s.ls}</code><code style="color:var(--kosaf-color-text-muted);overflow:hidden;text-overflow:ellipsis">${s.node}</code></div>`).join("")</script></body></html>
