<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--kosaf-font);color:var(--kosaf-color-text-primary)}.m{font-size:12px;line-height:16px;color:var(--kosaf-color-text-muted)}.t{font-size:14px;line-height:20px;font-weight:500}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:5px;border:1px solid var(--kosaf-color-border-subtle)}code{font:11px/14px ui-monospace,Menlo,monospace;color:var(--kosaf-color-text-secondary)}</style></head><body><div style="display:grid;grid-template-columns:repeat(14,1fr);gap:4px"><div style="display:flex;flex-direction:column;gap:4px"><div style="height:44px;border-radius:3px;background:var(--kosaf-gray-900);border:1px solid var(--kosaf-color-border-subtle)"></div><code>900</code><code style="font-size:9px">#333333</code></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:44px;border-radius:3px;background:var(--kosaf-gray-850);border:1px solid var(--kosaf-color-border-subtle)"></div><code>850</code><code style="font-size:9px">#444444</code></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:44px;border-radius:3px;background:var(--kosaf-gray-800);border:1px solid var(--kosaf-color-border-subtle)"></div><code>800</code><code style="font-size:9px">#666666</code></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:44px;border-radius:3px;background:var(--kosaf-gray-700);border:1px solid var(--kosaf-color-border-subtle)"></div><code>700</code><code style="font-size:9px">#707070</code></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:44px;border-radius:3px;background:var(--kosaf-gray-600);border:1px solid var(--kosaf-color-border-subtle)"></div><code>600</code><code style="font-size:9px">#888888</code></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:44px;border-radius:3px;background:var(--kosaf-gray-500);border:1px solid var(--kosaf-color-border-subtle)"></div><code>500</code><code style="font-size:9px">#A0A0A0</code></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:44px;border-radius:3px;background:var(--kosaf-gray-400);border:1px solid var(--kosaf-color-border-subtle)"></div><code>400</code><code style="font-size:9px">#ABABAB</code></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:44px;border-radius:3px;background:var(--kosaf-gray-350);border:1px solid var(--kosaf-color-border-subtle)"></div><code>350</code><code style="font-size:9px">#C1C1C1</code></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:44px;border-radius:3px;background:var(--kosaf-gray-300);border:1px solid var(--kosaf-color-border-subtle)"></div><code>300</code><code style="font-size:9px">#CCCCCC</code></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:44px;border-radius:3px;background:var(--kosaf-gray-250);border:1px solid var(--kosaf-color-border-subtle)"></div><code>250</code><code style="font-size:9px">#D9D9D9</code></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:44px;border-radius:3px;background:var(--kosaf-gray-200);border:1px solid var(--kosaf-color-border-subtle)"></div><code>200</code><code style="font-size:9px">#DDDDDD</code></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:44px;border-radius:3px;background:var(--kosaf-gray-150);border:1px solid var(--kosaf-color-border-subtle)"></div><code>150</code><code style="font-size:9px">#DFE0E4</code></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:44px;border-radius:3px;background:var(--kosaf-gray-100);border:1px solid var(--kosaf-color-border-subtle)"></div><code>100</code><code style="font-size:9px">#EAEAEA</code></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:44px;border-radius:3px;background:var(--k
