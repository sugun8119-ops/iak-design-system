<!-- @dsCard group="Colors" viewport="700x170" name="Surface & border" subtitle="Canvas, subtle, disabled fills; default/strong/subtle strokes" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--kosaf-font);color:var(--kosaf-color-text-primary)}.m{font-size:12px;line-height:16px;color:var(--kosaf-color-text-muted)}.t{font-size:14px;line-height:20px;font-weight:500}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:5px;border:1px solid var(--kosaf-color-border-subtle)}code{font:11px/14px ui-monospace,Menlo,monospace;color:var(--kosaf-color-text-secondary)}</style><link rel="stylesheet" href="doc.css"></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--kosaf-color-bg-canvas)"></div><div class="t">Canvas / Surface</div><code>#FFFFFF</code><code>--kosaf-color-bg-canvas</code></div><div class="sw"><div class="chip" style="background:var(--kosaf-color-bg-subtle)"></div><div class="t">BG Subtle</div><code>#F7F7F7</code><code>--kosaf-color-bg-subtle</code></div><div class="sw"><div class="chip" style="background:var(--kosaf-gray-100)"></div><div class="t">Disabled fill (Button/Checkbox)</div><code>#EAEAEA</code><code>--kosaf-gray-100</code></div><div class="sw"><div class="chip" style="background:var(--kosaf-color-surface-disabled)"></div><div class="t">Surface Disabled</div><code>#D9D9D9</code><code>--kosaf-color-surface-disabled</code></div><div class="sw"><div class="chip" style="border:2px solid var(--kosaf-color-border-default)"></div><div class="t">Border Default</div><code>#DDDDDD</code></div><div class="sw"><div class="chip" style="border:2px solid var(--kosaf-color-border-strong)"></div><div class="t">Border Strong</div><code>#C1C1C1</code></div></div></body></html>
