<!-- @dsCard group="Components · Navigation" viewport="700x760" name="MobileFilterSheet" subtitle="모바일 필터 바텀시트 · 취소=복원 / 적용=반영 / 초기화" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>MobileFilterSheet</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../guidelines/card-kit.js"></script>
<style>body{margin:0;background:#fff}</style>
</head><body><div id="r"></div>
<script type="text/babel">
const NS = window.KOSAFV1ProjectDesignSystem_f8c97b;
const { MobileFilterSheet, FilterChip, Button } = NS;
const META = {"name":"MobileFilterSheet","prov":"extension","node":"본문 1:93119","use":"draft/applied 분리 바텀시트. 취소·Esc 복원, 적용 시 칩·결과수 갱신","props":["open","value","groups","onApply","onClose","count","applyLabel","inline"],"states":"열림·draft 변경·0건·적용","ko":"모바일 필터 시트 · MobileFilterSheet"};
const DATA=[['사과','정가'],['사과','입찰'],['배','정가'],['포도','계약'],['복숭아','입찰']];
const cnt=(d)=>DATA.filter(([i,t])=>{const it=[...(d.class||[]),...(d.item||[])];if(it.length&&!it.includes(i))return false;if(d.deal&&d.deal.length&&!d.deal.includes(t))return false;return true;}).length;
function Demo(){const [applied,setApplied]=React.useState({class:['사과']});const [n,setN]=React.useState(0);
const chips=Object.entries(applied).flatMap(([k,a])=>(a||[]).map(o=>[k,o]));
return (<div style={{display:'flex',gap:20,alignItems:'flex-start'}}>
<KSec label="모바일 390 · 시트 (inline, 실제 동작)"><KPhone w={350}><div style={{height:600}}><MobileFilterSheet key={n} open inline value={applied} count={cnt} onApply={(v)=>setApplied(v)} onClose={()=>setN(n+1)}/></div></KPhone></KSec>
<KSec label="적용된 결과 (applied)" style={{flexDirection:'column',alignItems:'flex-start',width:270}}>
<div style={{fontSize:14}}>총 <b style={{color:'var(--kosaf-color-action-primary)',fontVariantNumeric:'tabular-nums'}}>{cnt(applied)}</b>개</div>
<div style={{display:'flex',flexWrap:'wrap',gap:'4px 12px'}}>{chips.map(([k,o])=><FilterChip key={k+o} variant="removable" onRemove={()=>setApplied({...applied,[k]:applied[k].filter(x=>x!==o)})}>{o}</FilterChip>)}</div>
{chips.length?<Button variant="secondary" size={34} onClick={()=>setApplied({})} style={{padding:'0 12px'}}>전체 초기화</Button>:<span style={{fontSize:13,color:'#707070'}}>적용된 필터 없음</span>}
<p style={{fontSize:12,lineHeight:'18px',color:'#707070',margin:0}}>시트에서 선택을 바꿔도 적용 전에는 왼쪽 결과가 바뀌지 않습니다. 닫기(×)·취소는 이전 값으로 되돌립니다. 실제 화면에서는 오버레이·Esc·포커스 가두기·스크롤 잠금이 동작합니다.</p>
</KSec></div>);}
ReactDOM.createRoot(document.getElementById('r')).render(<KCard meta={META}><Demo/></KCard>);
</script></body></html>
