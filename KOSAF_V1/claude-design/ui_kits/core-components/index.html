<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>KOSAF_V1 / Core Components</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--kosaf-color-bg-subtle)}</style>
</head><body><div id="r"></div>
<script type="text/babel">
const K = window.KOSAFV1ProjectDesignSystem_f8c97b;
const { Button, Input, Search, Checkbox, Radio, Tab, Badge, PaginationItem, TableRow, Modal, Stepper } = K;
const At = ({x,y,children}) => <div style={{position:'absolute',left:x,top:y}}>{children}</div>;
const H = ({x,y,children}) => <At x={x} y={y}><div style={{fontSize:24,fontWeight:700,lineHeight:'29px',color:'var(--kosaf-color-text-primary)'}}>{children}</div></At>;
const btn = [['primary','default',0,0],['primary','hover',184,0],['primary','disabled',368,0],['secondary','default',552,0],['secondary','hover',736,0],['secondary','disabled',920,0],['danger','default',0,70],['danger','hover',184,70],['danger','disabled',368,70],['primary','focus',552,70],['secondary','focus',736,70]];
function Board(){
  const [tab,setTab]=React.useState(1); const [page,setPage]=React.useState(1); const [step,setStep]=React.useState(1);
  const [chk,setChk]=React.useState(true); const [rad,setRad]=React.useState('a');
  return <div style={{position:'relative',width:1612,height:1882,fontFamily:'var(--kosaf-font)'}}>
    <H x={56} y={56}>Buttons</H>
    {btn.map(([v,s,x,y],i)=><At key={i} x={56+x} y={112+y}><Button variant={v} state={s} width={164}>버튼</Button></At>)}
    <H x={56} y={372}>Inputs / Selection</H>
    {['default','focus','error','disabled'].map((s,i)=><At key={s} x={56+i*320} y={428}><Input state={s} width={287} placeholder={s==='disabled'?'Disabled':'입력값을 입력하세요'}/></At>)}
    <At x={56} y={528}><Search/></At>
    {['unchecked','checked','focus','disabled'].map((s,i)=><At key={s} x={56+i*60} y={618}><Checkbox state={s}/></At>)}
    {['unchecked','checked','focus','disabled'].map((s,i)=><At key={s} x={360+i*60} y={618}><Radio state={s}/></At>)}
    <At x={56} y={670}><div style={{display:'flex',gap:24,fontSize:14}}><Checkbox checked={chk} onChange={setChk}>live checkbox</Checkbox><Radio name="lr" value="a" checked={rad==='a'} onChange={setRad}>A</Radio><Radio name="lr" value="b" checked={rad==='b'} onChange={setRad}>B</Radio></div></At>
    <H x={56} y={728}>Tabs / Badge / Pagination</H>
    <At x={56} y={784}><div role="tablist" style={{display:'flex',gap:16}}>{['입찰거래','정가거래'].map((t,i)=><Tab key={t} selected={tab===i} onClick={()=>setTab(i)}>{t}</Tab>)}</div></At>
    <At x={380} y={784}><Badge>답변완료</Badge></At>
    <At x={520} y={784}><div style={{display:'flex',gap:12}}><PaginationItem state="default">1</PaginationItem><PaginationItem state="hover">1</PaginationItem><PaginationItem state="selected">1</PaginationItem><PaginationItem state="disabled">1</PaginationItem></div></At>
    <At x={780} y={784}><div style={{display:'flex',gap:12}}>{[1,2,3,4,5].map(n=><PaginationItem key={n} selected={page===n} onClick={()=>setPage(n)}>{n}</PaginationItem>)}</div></At>
    <H x={56} y={894}>Data Display</H>
    <At x={56} y={950}><TableRow width={1500} cells={['상품명','판매자','판매단가','수량','상태']}/></At>
    <At x={56} y={1040}><TableRow device="mobile" width={350} cells={['상품명','상태']}/></At>
    <H x={56} y={1140}>Modal Shell / Stepper</H>
    <At x={56} y={1196}><Modal inline title="상세 정보"></Modal></At>
    <At x={820} y={1196}><div onClick={()=>setStep((step+1)%3)} style={{cursor:'pointer'}}><Stepper current={step}/></div></At>
  </div>;
}
ReactDOM.createRoot(document.getElementById('r')).render(<Board/>);
</script></body></html>
